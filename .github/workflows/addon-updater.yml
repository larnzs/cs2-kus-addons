name: Update CS2 Addons

on:
  push:
    branches:
      - integration/kus-monorepo
    paths:
      - "DEPENDENCIES.json"
      - "scripts/Update-Addons.ps1"
      - "scripts/Test-AddonOverlay.ps1"
      - "scripts/Inspect-Releases.ps1"
      - "scripts/Invoke-RuntimeAddonUpdate.ps1"
      - "scripts/check-updates.sh"
      - "scripts/update/**"
      - ".github/workflows/addon-updater.yml"
      - "windows/**"
      - "linux/**"
      - "google/**"
      - "docker/**"
      - ".dockerignore"
      - "game/csgo/**"
      - "README.md"
  schedule:
    # Check the complete KUS catalog and every automated Manifest add-on every five minutes.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Optional addon name, repository URL, slug, or comma-separated list. Empty means all automated addons."
        required: false
        default: ""
        type: string
      force:
        description: "Force reinstall selected release(s)."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: addon-updater
  cancel-in-progress: false

jobs:
  update-kus-addons:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'workflow_dispatch' || inputs.only == '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/kus-monorepo
          fetch-depth: 0
      - name: Set up .NET SDKs for source-built add-ons
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install KUS updater tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip rsync
      - name: Validate syntax for every KUS and Larnz shell updater
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/check-updates.sh scripts/update/update.sh scripts/update/lib.sh scripts/update/manifest-addon.sh scripts/update/catalog-plugin.sh scripts/update/plugins/*.sh

          bash -euo pipefail <<'CONFIG_GUARD_TEST'
          exec 3>&1
          source scripts/update/lib.sh
          PLUGIN_PATHS=("game/csgo/addons/counterstrikesharp")
          protected_paths=(
            "game/csgo/cfg"
            "game/csgo/addons/counterstrikesharp/configs"
            "game/csgo/addons/counterstrikesharp/configs/custom.json"
            "game/csgo/addons/windows/addons/counterstrikesharp/configs"
            "game/csgo/addons/windows/addons/counterstrikesharp/configs/custom.json"
          )
          for protected in "${protected_paths[@]}"; do
            if ! is_protected_config_path "$protected"; then
              echo "Protected config path was not recognized: $protected" >&2
              exit 1
            fi
            if ( assert_write_target "$protected" >/dev/null 2>&1 ); then
              echo "Updater unexpectedly permits writes to protected config path: $protected" >&2
              exit 1
            fi
          done
          for safe in "game/csgo/addons/counterstrikesharp/plugins/Example/configs.json" "game/csgo/addons/counterstrikesharp/bin/win64/counterstrikesharp.dll" "game/csgo/addons/counterstrikesharp/configs/plugins/cs2-tags" "game/csgo/addons/counterstrikesharp/configs/plugins/cs2-tags/cs2-tags-example.toml"; do
            if is_protected_config_path "$safe"; then
              echo "A non-protected path was incorrectly blocked: $safe" >&2
              exit 1
            fi
          done
          managed_config_path="game/csgo/addons/counterstrikesharp/configs/plugins/cs2-tags"
          if ! ( assert_write_target "$managed_config_path" >/dev/null 2>&1 ); then
            echo "Updater did not allow the explicit cs2-tags example-config destination." >&2
            exit 1
          fi
          if ! printf '%s\n' "${RSYNC_FLAGS[@]}" | grep -Fqx -- '/cfg/***'; then
            echo "Rsync safety exclude for manually managed game/csgo/cfg is missing." >&2
            exit 1
          fi
          if ! printf '%s\n' "${RSYNC_FLAGS[@]}" | grep -Fqx -- '**/counterstrikesharp/configs/***'; then
            echo "Rsync safety excludes for manual CounterStrikeSharp configs are missing." >&2
            exit 1
          fi
          if ( assert_delete_target "game/csgo/addons/counterstrikesharp" >/dev/null 2>&1 ); then
            echo "Updater unexpectedly permits deleting the parent of the protected configs tree." >&2
            exit 1
          fi
          CONFIG_GUARD_TEST

          # Regression test: CounterStrikeSharp is in the Larnz-managed table,
          # whose first-column display name is Markdown-linked.
          bash -euo pipefail <<'README_VERSION_LOOKUP_TEST'
          exec 3>&1
          source scripts/update/lib.sh
          actual="$(readme_line_number "CounterStrikeSharp" "https://github.com/roflmuffin/CounterStrikeSharp")"
          expected="$(awk '/^\| \[CounterStrikeSharp\]\(https:\/\/github\.com\/roflmuffin\/CounterStrikeSharp\) \|/ { print NR }' README.md)"
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "README version lookup failed for Markdown-linked CounterStrikeSharp row: actual=$actual expected=$expected" >&2
            exit 1
          fi
          README_VERSION_LOOKUP_TEST

          for special in scripts/update/plugins/metamod-source.sh scripts/update/plugins/counterstrikesharp.sh; do
            grep -q 'source scripts/update/manifest-addon.sh' "$special"
            grep -q 'manifest_update_version' "$special"
          done
          kus_script_count=0
          while IFS= read -r script; do
            [[ -n "$script" ]] || continue
            if [[ ! -f "scripts/update/plugins/$script" ]]; then
              echo "Missing KUS updater script documented in scripts/update/README.md: $script" >&2
              exit 1
            fi
            kus_script_count=$((kus_script_count + 1))
          done < <(sed -n '/^## Existing plugin scripts/,/^## Files/p' scripts/update/README.md | sed -nE 's/.*`plugins\/([^ `]+\.sh)`.*/\1/p')
          if [[ "$kus_script_count" -eq 0 ]]; then
            echo "No KUS per-plugin scripts were found in scripts/update/README.md." >&2
            exit 1
          fi

          manifest_script_count=0
          while IFS= read -r addon_name; do
            [[ -n "$addon_name" ]] || continue
            slug=$(printf '%s' "$addon_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
            if [[ ! -f "scripts/update/plugins/$slug.sh" ]]; then
              echo "Missing updater script for installed automated manifest add-on: $addon_name ($slug.sh)" >&2
              exit 1
            fi
            manifest_script_count=$((manifest_script_count + 1))
          done < <(jq -r '.addons[] | select(.automation_supported != false) | .name' DEPENDENCIES.json)

          echo "Coverage passed: $kus_script_count KUS scripts documented; $manifest_script_count installed/automated manifest add-ons mapped to scripts."
          echo "All KUS and Larnz add-on shell scripts passed bash -n and special manifest-sync checks."
      - name: Run KUS and manifest-backed per-add-on scripts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          protected_paths=(
            "game/csgo/cfg"
            "game/csgo/addons/counterstrikesharp/configs"
            "game/csgo/addons/windows/addons/counterstrikesharp/configs"
          )
          protected_before="$RUNNER_TEMP/protected-configs-before.txt"
          protected_after="$RUNNER_TEMP/protected-configs-after.txt"
          git ls-tree -r HEAD -- "${protected_paths[@]}" | sort > "$protected_before"

          # GameModeManager's ZIP is the single source of truth for its four bundled
          # plugins and three shared APIs. Repair the entire bundle if any runtime file
          # is missing; never bootstrap GG1/MenuManager from separate release archives.
          bundle_missing=0
          for required in \
            "game/csgo/addons/counterstrikesharp/plugins/GameModeManager/GameModeManager.dll" \
            "game/csgo/addons/counterstrikesharp/plugins/GameModeManager/GameModeManager.deps.json" \
            "game/csgo/addons/counterstrikesharp/plugins/GameModeManager/Gameloop.Vdf.dll" \
            "game/csgo/addons/counterstrikesharp/plugins/GG1MapChooser/GG1MapChooser.dll" \
            "game/csgo/addons/counterstrikesharp/plugins/GG1MapChooser/GG1MapChooser.deps.json" \
            "game/csgo/addons/counterstrikesharp/plugins/MenuManagerCore/MenuManagerCore.dll" \
            "game/csgo/addons/counterstrikesharp/plugins/MenuManagerCore/runtimes/linux-x64/native/libe_sqlite3.so" \
            "game/csgo/addons/counterstrikesharp/plugins/MenuManagerCore/runtimes/win-x64/native/e_sqlite3.dll" \
            "game/csgo/addons/counterstrikesharp/plugins/PMM_GG1MapChooser/PMM_GG1MapChooser.dll" \
            "game/csgo/addons/counterstrikesharp/plugins/PMM_GG1MapChooser/PMM_GG1MapChooser.deps.json" \
            "game/csgo/addons/counterstrikesharp/plugins/PMM_GG1MapChooser/harmony/0Harmony.dll" \
            "game/csgo/addons/counterstrikesharp/shared/GameModeManager.Shared/GameModeManager.Shared.dll" \
            "game/csgo/addons/counterstrikesharp/shared/ggmcAPI/ggmcAPI.dll" \
            "game/csgo/addons/counterstrikesharp/shared/MenuManagerApi/MenuManagerApi.dll"; do
            if [[ ! -f "$required" ]]; then
              echo "Missing GameModeManager bundle file: $required"
              bundle_missing=1
            fi
          done
          updater_status=0
          if [[ "$bundle_missing" -eq 1 ]]; then
            echo "GameModeManager bundle is incomplete; repairing all bundled components."
            bash scripts/update/update.sh --only gamemodemanager || updater_status=$?
          else
            bash scripts/update/update.sh || updater_status=$?
          fi

          # The shell updater creates local commits before publishing. Compare the
          # protected path's tree entries at HEAD, not just the working-tree diff.
          git ls-tree -r HEAD -- "${protected_paths[@]}" | sort > "$protected_after"
          if ! diff -u "$protected_before" "$protected_after"; then
            echo "ERROR: automated KUS/Larnz updater changed manually managed game/csgo/cfg or CounterStrikeSharp configs." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Updater left uncommitted changes:" >&2
            git status --short >&2
            exit 1
          fi
          pushed=false
          for attempt in 1 2 3; do
            echo "Publishing updater commit(s), attempt $attempt/3..."
            if ! git fetch origin integration/kus-monorepo; then
              echo "ERROR: Could not fetch the latest integration branch before publishing." >&2
              exit 1
            fi
            if ! git rebase origin/integration/kus-monorepo; then
              git rebase --abort || true
              echo "ERROR: Updater commits conflict with newer repository changes; no force-push attempted." >&2
              exit 1
            fi
            if git push origin HEAD:refs/heads/integration/kus-monorepo; then
              pushed=true
              break
            fi
            echo "Remote advanced during push; retrying with a fresh fetch/rebase." >&2
          done
          if [[ "$pushed" != "true" ]]; then
            echo "ERROR: Could not publish updater commits after three safe attempts." >&2
            exit 1
          fi
          if [[ "$updater_status" -ne 0 ]]; then
            echo "Updater reported failures (exit $updater_status); successful add-on commits were published." >&2
            exit "$updater_status"
          fi

  update:
    needs: update-kus-addons
    if: always() && github.actor != 'github-actions[bot]' && needs.update-kus-addons.result != 'cancelled'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout latest integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/kus-monorepo
          fetch-depth: 0

      - name: Set up .NET SDKs for manifest source builds
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate PowerShell syntax, unified updater roles, and runtime policy
        shell: pwsh
        run: |
          $paths = @(
            ".\scripts\Update-Addons.ps1",
            ".\scripts\Test-AddonOverlay.ps1",
            ".\scripts\Inspect-Releases.ps1",
            ".\scripts\Deploy-Runtime.ps1",
            ".\scripts\Invoke-RuntimeAddonUpdate.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw ("PowerShell syntax errors in " + $path + ":" + [Environment]::NewLine + (($parseErrors | ForEach-Object Message) -join [Environment]::NewLine))
            }
          }

          $manifest = Get-Content -LiteralPath ".\DEPENDENCIES.json" -Raw | ConvertFrom-Json
          $metamod = @($manifest.addons | Where-Object name -eq "Metamod:Source") | Select-Object -First 1
          if (-not $metamod -or [string]$metamod.type -ne "github_release" -or
              [string]$metamod.version_format -ne "metamod" -or
              [string]$metamod.readme_url -ne "https://www.metamodsource.net/downloads.php?branch=dev") {
            throw "Metamod:Source must be managed from the KUS development download page."
          }
          $normalizedMetaTag = [regex]::Replace([string]$metamod.release_tag, '^([0-9]+\.[0-9]+\.[0-9]+)\.(\d+)$', '$1-$2')
          if ([string]$metamod.version -ne $normalizedMetaTag) {
            throw "Metamod:Source DEPENDENCIES.json version must match its normalized release_tag."
          }
          foreach ($assetPattern in @("mmsource-*-windows.zip", "mmsource-*-linux.tar.gz")) {
            if (@($metamod.assets | Where-Object { $_ -eq $assetPattern }).Count -ne 1) {
              throw "Metamod:Source must select both the latest Windows ZIP and Linux TAR.GZ release assets."
            }
          }
          foreach ($requiredPath in @(
            "addons/metamod/bin/win64/metamod.2.cs2.dll",
            "addons/metamod/bin/linuxsteamrt64/metamod.2.cs2.so"
          )) {
            if (@($metamod.verify_paths | Where-Object { $_ -eq $requiredPath }).Count -ne 1) {
              throw "Metamod:Source verification is missing $requiredPath."
            }
          }

          $css = @($manifest.addons | Where-Object name -eq "CounterStrikeSharp") | Select-Object -First 1
          if (-not $css) { throw "CounterStrikeSharp is missing from DEPENDENCIES.json." }
          if (-not [bool]$css.runtime_required) {
            throw "CounterStrikeSharp must have runtime_required=true."
          }
          foreach ($assetPattern in @(
            "counterstrikesharp-with-runtime-windows-{version}.zip",
            "counterstrikesharp-with-runtime-linux-{version}.zip"
          )) {
            if (@($css.assets | Where-Object { $_ -eq $assetPattern }).Count -ne 1) {
              throw "CounterStrikeSharp must select both platform with-runtime release assets."
            }
          }
          if ([string]$css.required_asset_name_contains -ne "with-runtime") {
            throw "CounterStrikeSharp runtime asset marker must cover both platform with-runtime packages."
          }
          $cssWindowsMapping = @($css.asset_mappings.PSObject.Properties | Where-Object Name -eq "counterstrikesharp-with-runtime-windows-{version}.zip") | Select-Object -First 1
          if (-not $cssWindowsMapping) { throw "CounterStrikeSharp Windows with-runtime mapping is missing." }
          $cssWindowsTargets = @($cssWindowsMapping.Value)
          if (-not ($cssWindowsTargets | Where-Object {
                [string]$_.merge -eq "release_plugin_directory" -and
                [string]$_.install_path -eq "addons/windows/addons/counterstrikesharp"
              })) {
            throw "CounterStrikeSharp Windows with-runtime files must populate the KUS Windows overlay."
          }
          if (-not ($cssWindowsTargets | Where-Object { [string]$_.merge -eq "release_csgo_root" })) {
            throw "CounterStrikeSharp Windows archive must also update the shared payload."
          }
          $cssLinuxMapping = @($css.asset_mappings.PSObject.Properties | Where-Object Name -eq "counterstrikesharp-with-runtime-linux-{version}.zip") | Select-Object -First 1
          if (-not $cssLinuxMapping -or
              -not (@($cssLinuxMapping.Value) | Where-Object { [string]$_.merge -eq "release_csgo_root" })) {
            throw "CounterStrikeSharp Linux with-runtime archive must update the shared payload."
          }
          if (-not (Test-Path -LiteralPath ".\game\csgo\addons\counterstrikesharp\bin\linuxsteamrt64\counterstrikesharp.so")) {
            throw "Shared Linux CounterStrikeSharp binary is missing from game/csgo."
          }
          foreach ($requiredGlob in @(
            "addons/windows/addons/counterstrikesharp/dotnet/shared/Microsoft.NETCore.App/*/System.Private.CoreLib.dll",
            "addons/windows/addons/counterstrikesharp/dotnet/host/fxr/*/hostfxr.dll"
          )) {
            if (@($css.verify_globs | Where-Object { $_ -eq $requiredGlob }).Count -ne 1) {
              throw "CounterStrikeSharp runtime verification glob is missing: $requiredGlob"
            }
          }

          $updater = Get-Content -LiteralPath ".\scripts\Update-Addons.ps1" -Raw
          $overlayPolicy = Get-Content -LiteralPath ".\scripts\Test-AddonOverlay.ps1" -Raw
          if ($updater -notmatch 'configs/plugins/cs2-tags' -or
              $overlayPolicy -notmatch 'cs2-tags-example.toml') {
            throw "The cs2-tags sample-config allowlist must be present in the PowerShell updater and config snapshot policy."
          }
          if ($updater -notmatch 'Get-AddonMissingFiles' -or
              $updater -notmatch 'required_asset_name_contains' -or
              $updater -notmatch '\$needsRepair') {
            throw "The updater must enforce the runtime asset and repair missing files even when the version is unchanged."
          }
          if ($updater -match 'Get-Process\s+-Name\s+"cs2"') {
            throw "The add-on source-payload updater must not block on active CS2 processes; it does not deploy to the live runtime."
          }

          $install = Get-Content -LiteralPath ".\windows\install.bat" -Raw
          $update = Get-Content -LiteralPath ".\windows\update.bat" -Raw

          if ($install -notmatch 'tasklist /FI "IMAGENAME eq cs2\.exe"') {
            throw "install.bat must refuse SteamCMD/deployment work while CS2 is active."
          }
          if ($install -notmatch '(?i)\+app_update\s+730') {
            throw "install.bat must install/update CS2 through SteamCMD."
          }
          foreach ($required in @(
            "Invoke-RuntimeAddonUpdate.ps1",
            "Deploy-Runtime.ps1",
            "Patch-GameInfo.ps1",
            "Test-AddonOverlay.ps1",
            'call "%ROOT_DIR%\windows\update.bat"'
          )) {
            if ($install -notmatch [regex]::Escape($required)) {
              throw "The unified install/update entrypoint is missing: $required"
            }
          }
          if ($install -match '(?im)^\s*start\s+.*cs2\.exe') {
            throw "install.bat must never launch cs2.exe."
          }
          if ($update -match '(?i)steamcmd\.exe|\+app_update\s+730|Invoke-RuntimeAddonUpdate|Deploy-Runtime|Patch-GameInfo') {
            throw "update.bat must be repository-only and must not touch SteamCMD, plugins, or runtime files."
          }
          if ($update -notmatch 'git switch integration/kus-monorepo' -or
              $update -notmatch 'git pull --ff-only origin integration/kus-monorepo') {
            throw "update.bat must switch to integration/kus-monorepo and perform only a fast-forward pull."
          }
          if ((Test-Path -LiteralPath ".\windows\win.bat" -PathType Leaf) -or
              (Test-Path -LiteralPath ".\windows\game-update.bat" -PathType Leaf)) {
            throw "The old overlapping win/game-update scripts should be replaced by install.bat."
          }
          $runtimeAddonUpdater = Get-Content -LiteralPath ".\scripts\Invoke-RuntimeAddonUpdate.ps1" -Raw
          if ($runtimeAddonUpdater -notmatch 'scripts\\Update-Addons\.ps1' -or
              $runtimeAddonUpdater -notmatch '"worktree", "add", "--detach"' -or
              $runtimeAddonUpdater -notmatch 'Invoke-GitCapture' -or
              $runtimeAddonUpdater -notmatch '"push", "origin", "HEAD:refs/heads/\$Branch"' -or
              $runtimeAddonUpdater -notmatch '"worktree", "remove", "--force"') {
            throw "Runtime addon updates must use an isolated worktree and publish successful commits to the private branch."
          }

          Write-Host "PowerShell syntax and unified updater role checks passed."
      - name: Validate example instance template
        shell: pwsh
        run: |
          $templateBat = (Get-Content -LiteralPath ".\windows\instance-template\run.bat" -Raw) -replace [string][char]13, ""
          $templateUpdate = (Get-Content -LiteralPath ".\windows\instance-template\update.bat" -Raw) -replace [string][char]13, ""
          $templateVbs = (Get-Content -LiteralPath ".\windows\instance-template\run.vbs" -Raw) -replace [string][char]13, ""
          $templateGuardian = (Get-Content -LiteralPath ".\windows\instance-template\watchdog.bat" -Raw) -replace [string][char]13, ""
          $templateIni = Get-Content -LiteralPath ".\windows\instance-template\instance.example.ini" -Raw
          $templateIgnore = Get-Content -LiteralPath ".\windows\instance-template\.gitignore" -Raw

          if ($templateBat -notmatch 'instance\.ini' -or $templateBat -notmatch 'WORKSHOP_ARGS' -or $templateBat -notmatch 'start "" /wait "%CS2_EXE%"') {
            throw "Example run.bat must read instance.ini, support optional Workshop collection, and launch one CS2 process."
          }
          foreach ($forbidden in @('git -C', 'app_update 730', 'UpdateUpstreamAddons', 'UpdateRepository', 'OverlayPayload', 'Invoke-RuntimeAddonUpdate', 'call "%~dp0update.bat"')) {
            if ($templateBat -match [regex]::Escape($forbidden)) {
              throw "Launch-only run.bat must not perform or invoke maintenance; found: $forbidden"
            }
          }
          foreach ($required in @('CS2-KUS-Maintenance.lock', ':WaitForMaintenance', 'Starting CS2 on port', 'set "RC=100"')) {
            if ($templateBat -notmatch [regex]::Escape($required)) {
              throw "Launch-only run.bat is missing expected behavior: $required"
            }
          }
          foreach ($required in @('set "GAME_DIR=%SERVER_DIR%\game\csgo"', 'call :SyncCustomFiles', ':SyncCustomFiles', 'xcopy "%CUSTOM_DIR%\cfg\*"', 'xcopy "%CUSTOM_DIR%\addons\*"')) {
            if ($templateBat -notmatch [regex]::Escape($required)) {
              throw "run.bat is missing the launch-time CUSTOM_FOLDER copy behavior: $required"
            }
          }
          if ($templateBat -match '(?i)/MIR|/PURGE|robocopy') {
            throw "run.bat custom-folder copies must remain additive and never mirror/purge the runtime."
          }
          foreach ($required in @('git -C "%REPO_ROOT%" pull --ff-only origin integration/kus-monorepo', 'app_update 730', 'call :UpdateUpstreamAddons', ':OverlayPayload', ':AcquireLock', 'CS2-KUS-Maintenance-success.marker')) {
            if ($templateUpdate -notmatch [regex]::Escape($required)) {
              throw "Instance update.bat is missing maintenance behavior: $required"
            }
          }
          if ($templateUpdate -match '(?i)start "" /wait "%CS2_EXE%"| -dedicated |\+sv_maxplayers|\+exec %EXEC%|/MIR|/PURGE') {
            throw "Instance update.bat must not launch CS2 or use destructive mirroring/purge behavior."
          }
          if ($templateUpdate -match '(?i)CUSTOM_DIR|SyncOverrides|robocopy "%CUSTOM_FOLDER%|robocopy "%CUSTOM_DIR%') {
            throw "Instance update.bat must never merge CUSTOM_FOLDER files into shared runtime paths."
          }
          foreach ($required in @('ResolveRunnerBatch', 'CS2-KUS-Watchdog.log', 'shell.Run(commandLine, 0, True)', 'WScript.Sleep 100', 'On Error Resume Next', 'cmd.exe')) {
            if ($templateVbs -notmatch [regex]::Escape($required)) {
              throw "Hardened run.vbs is missing expected behavior: $required"
            }
          }
          if ($templateVbs -notmatch 'cmdExe = shell\.ExpandEnvironmentStrings\("%ComSpec%"\)' -or
              $templateVbs -notmatch 'runExitCode = shell\.Run\(commandLine, 0, True\)' -or
              $templateVbs -match '(?i)update\.bat|run_fast\.bat|supervisor\.ps1|Win32_Process|powershell|Maintenance-success\.marker') {
            throw "run.vbs must invoke only the launch runner, handle failures, and never run maintenance."
          }
          foreach ($required in @('cscript.exe', '%~dp0run.vbs', ':watch', 'goto :watch')) {
            if (-not $templateGuardian.Contains($required)) {
              throw "watchdog.bat is missing required guardian behavior: $required"
            }
          }
          if ($templateGuardian -match '(?i)update\.bat|app_update 730|Invoke-RuntimeAddonUpdate|robocopy') {
            throw "watchdog.bat must never perform maintenance."
          }
          if ($templateBat -match '(?i)/MIR|/PURGE') {
            throw "Custom-folder overrides must never use destructive mirror or purge options."
          }
          if ($templateBat -match '(?i)ForcePostExitMaintenance|WaitForAllCS2|RunMaintenance|UpdateGame') {
            throw "Launch-only run.bat must never enter maintenance or post-exit update loops."
          }
          $serverDirConfigured = @($templateIni -split "`n" | Where-Object { $_.TrimEnd() -eq 'SERVER_DIR=C:\REPLACE_ME\cs2-kus-addons\server' }).Count -eq 1
          if (-not $serverDirConfigured) {
            throw "The external Instance template must require an explicit absolute SERVER_DIR path."
          }
          foreach ($runnerText in @($templateBat, $templateUpdate)) {
            if ($runnerText -notmatch '(?im)^if not defined SERVER_DIR goto :MissingServerDir' -or
                $runnerText -notmatch '(?im)^:MissingServerDir') {
              throw "Both Instance launch and maintenance must fail clearly when SERVER_DIR is not configured."
            }
          }
          if ($templateIni -notmatch '(?im)^RCON_PASSWORD=CHANGE_ME_TO_A_STRONG_PASSWORD[ \t\r]*$' -or
              $templateIgnore -notmatch '(?im)^instance\.ini[ \t\r]*$') {
            throw "Example INI must use a placeholder RCON password and ignore local instance.ini."
          }
          Write-Host "Validated launch-time custom-folder copy, separate maintenance, hardened VBS loop, outer VBS guardian, and private INI policy."

      - name: Smoke-test explicit release archive mappings
        if: github.event_name != 'schedule'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $selected = @("SLAYER_AntiCamp", "SLAYER_HeadshotOnly", "CS2-TeamLimiter", "cs2-showdamage", "CS2-KillFeedFilter")
          $ErrorActionPreference = "Stop"
          & ".\scripts\Inspect-Releases.ps1" -Only $selected
          if (-not $?) {
            throw "Explicit release archive mapping smoke test failed."
          }

      - name: Smoke-test GameModeManager bundled release archive
        if: github.event_name != 'schedule'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $readme = Get-Content -LiteralPath ".\README.md" -Raw
          $versionMatch = [regex]::Match($readme, '(?m)^\|\s*\[GameModeManager\]\(https://github\.com/nickj609/GameModeManager\)\s*\|\s*`([^`]+)`\s*\|')
          if (-not $versionMatch.Success) { throw "Could not read GameModeManager version from README." }
          $version = $versionMatch.Groups[1].Value
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cs2-kus-addons-updater-validation"
          }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/nickj609/GameModeManager/releases/tags/v$version"
          $assetName = "GameModeManager_v$version.zip"
          $asset = @($release.assets | Where-Object name -eq $assetName) | Select-Object -First 1
          if (-not $asset) { throw "GameModeManager release v$version has no $assetName asset." }
          $zipPath = Join-Path $env:RUNNER_TEMP $assetName
          $extractPath = Join-Path $env:RUNNER_TEMP "gmm-bundle-$version"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force
          foreach ($rootFolder in @("addons", "cfg")) {
            if (-not (Test-Path -LiteralPath (Join-Path $extractPath $rootFolder) -PathType Container)) {
              throw "GameModeManager ZIP is missing root folder '$rootFolder'."
            }
          }
          $bundleRoot = Join-Path $extractPath "addons\counterstrikesharp"
          $requiredFiles = @(
            "plugins\GameModeManager\GameModeManager.dll",
            "plugins\GameModeManager\GameModeManager.deps.json",
            "plugins\GameModeManager\Gameloop.Vdf.dll",
            "plugins\GG1MapChooser\GG1MapChooser.dll",
            "plugins\GG1MapChooser\GG1MapChooser.deps.json",
            "plugins\MenuManagerCore\MenuManagerCore.dll",
            "plugins\MenuManagerCore\MenuManagerCore.deps.json",
            "plugins\MenuManagerCore\runtimes\linux-x64\native\libe_sqlite3.so",
            "plugins\MenuManagerCore\runtimes\win-x64\native\e_sqlite3.dll",
            "plugins\PMM_GG1MapChooser\PMM_GG1MapChooser.dll",
            "plugins\PMM_GG1MapChooser\PMM_GG1MapChooser.deps.json",
            "plugins\PMM_GG1MapChooser\harmony\0Harmony.dll",
            "shared\GameModeManager.Shared\GameModeManager.Shared.dll",
            "shared\GameModeManager.Shared\GameModeManager.Shared.deps.json",
            "shared\ggmcAPI\ggmcAPI.dll",
            "shared\ggmcAPI\ggmcAPI.deps.json",
            "shared\MenuManagerApi\MenuManagerApi.dll",
            "shared\MenuManagerApi\MenuManagerApi.deps.json"
          )
          foreach ($relative in $requiredFiles) {
            $path = Join-Path $bundleRoot $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "GameModeManager $version bundle is missing expected file: $relative"
            }
          }
          Write-Host "Verified GameModeManager $version ZIP root and all four plugin / three shared dependency payloads."

      - name: Validate manifest and automation policy
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath ".\DEPENDENCIES.json" -Raw | ConvertFrom-Json
          if ([int]$manifest.schema_version -lt 2) {
            throw "Unsupported DEPENDENCIES.json schema version."
          }

          $css = @($manifest.addons | Where-Object name -eq "CounterStrikeSharp") | Select-Object -First 1
          if (-not $css -or -not [bool]$css.runtime_required) {
            throw "CounterStrikeSharp must be present and runtime_required=true."
          }
          if (@($css.assets | Where-Object { $_ -eq "counterstrikesharp-with-runtime-windows-{version}.zip" }).Count -ne 1) {
            throw "CounterStrikeSharp must use the Windows with-runtime package."
          }
          if (@($css.verify_globs).Count -lt 2) {
            throw "CounterStrikeSharp must verify versioned .NET runtime and hostfxr files."
          }

          $vipCore = @($manifest.addons | Where-Object { [string]$_.name -eq "VIPCore" })
          if ($vipCore.Count -ne 1 -or -not [bool]$vipCore[0].installed) {
            throw "VIPCore must have exactly one installed manifest entry."
          }
          if ([string]$vipCore[0].track -ne "latest_matching_release" -or
              [string]$vipCore[0].track_asset -ne "VIPCore.zip") {
            throw "VIPCore must track full Core releases by the VIPCore.zip asset."
          }
          if (@($vipCore[0].depends_on | Where-Object { $_ -eq "Metamod:Source" }).Count -ne 1 -or
              @($vipCore[0].depends_on | Where-Object { $_ -eq "CounterStrikeSharp" }).Count -ne 1) {
            throw "VIPCore must declare MetaMod:Source and CounterStrikeSharp dependencies."
          }

          $vipModules = @($manifest.addons | Where-Object { [string]$_.name -eq "VIPCore Modules" })
          if ($vipModules.Count -ne 1 -or -not [bool]$vipModules[0].installed) {
            throw "VIPCore Modules must have exactly one installed manifest entry."
          }
          if ([string]$vipModules[0].track -ne "latest_matching_release" -or
              [string]$vipModules[0].track_asset -ne "VIP_Modules.zip" -or
              @($vipModules[0].verify_paths).Count -ne 45) {
            throw "VIPCore Modules must track VIP_Modules.zip and verify all 45 installed module DLLs."
          }

          $names = @($manifest.addons | ForEach-Object { [string]$_.name })
          $duplicates = @($names | Group-Object | Where-Object Count -gt 1)
          if ($duplicates.Count -gt 0) {
            throw ("Duplicate addon names: " + (($duplicates | ForEach-Object Name) -join ", "))
          }

          $weaponPaints = @($manifest.addons | Where-Object name -eq "WeaponPaints") | Select-Object -First 1
          if (-not $weaponPaints) {
            throw "WeaponPaints is missing from DEPENDENCIES.json."
          }
          if ($weaponPaints.PSObject.Properties.Name -contains "automation_supported" -and
              -not [bool]$weaponPaints.automation_supported) {
            throw "WeaponPaints must be managed by the stable-release updater."
          }

          foreach ($bundlePolicy in @(
            @{ name = "GG1MapChooser"; component = "GG1MapChooser"; shared = "ggmcAPI"; verify = @(
              "addons/counterstrikesharp/plugins/GG1MapChooser/GG1MapChooser.dll",
              "addons/counterstrikesharp/shared/ggmcAPI/ggmcAPI.dll"
            ) },
            @{ name = "MenuManagerCS2"; component = "MenuManagerCore"; shared = "MenuManagerApi"; verify = @(
              "addons/counterstrikesharp/plugins/MenuManagerCore/MenuManagerCore.dll",
              "addons/counterstrikesharp/plugins/MenuManagerCore/runtimes/linux-x64/native/libe_sqlite3.so",
              "addons/counterstrikesharp/plugins/MenuManagerCore/runtimes/win-x64/native/e_sqlite3.dll",
              "addons/counterstrikesharp/shared/MenuManagerApi/MenuManagerApi.dll"
            ) }
          )) {
            $bundled = @($manifest.addons | Where-Object name -eq $bundlePolicy.name) | Select-Object -First 1
            if (-not $bundled -or [string]$bundled.type -ne "bundled" -or
                [string]$bundled.version -ne "bundled" -or
                [bool]$bundled.automation_supported -or
                [string]$bundled.bundled_by -ne "GameModeManager" -or
                [string]$bundled.bundle_component -ne $bundlePolicy.component -or
                [string]$bundled.bundle_shared_dependency -ne $bundlePolicy.shared) {
              throw "$($bundlePolicy.name) must be a non-automated GameModeManager bundle dependency."
            }
            foreach ($requiredPath in $bundlePolicy.verify) {
              if (@($bundled.verify_paths | Where-Object { [string]$_ -eq $requiredPath }).Count -ne 1) {
                throw "$($bundlePolicy.name) verification is missing '$requiredPath'."
              }
            }
            foreach ($forbiddenField in @("assets", "asset_mappings", "track", "track_asset", "release_tag")) {
              if ($bundled.PSObject.Properties.Name -contains $forbiddenField) {
                throw "$($bundlePolicy.name) must not retain independent release tracking field '$forbiddenField'."
              }
            }
          }

          $automated = @($manifest.addons | Where-Object {
            -not ($_.PSObject.Properties.Name -contains "automation_supported" -and -not [bool]$_.automation_supported)
          })
          $manual = @($manifest.addons | Where-Object {
            $_.PSObject.Properties.Name -contains "automation_supported" -and -not [bool]$_.automation_supported
          })
          foreach ($slayerName in @("SLAYER_AntiCamp", "SLAYER_HeadshotOnly")) {
            $slayer = @($manifest.addons | Where-Object name -eq $slayerName) | Select-Object -First 1
            if (-not $slayer) { throw "Missing manifest entry: $slayerName" }
            $assetPattern = "CS2.$slayerName.v{version}.zip"
            $mappingProperty = $slayer.asset_mappings.PSObject.Properties |
              Where-Object Name -eq $assetPattern |
              Select-Object -First 1
            if (-not $mappingProperty) { throw "Missing versioned asset mapping for $slayerName." }
            $mappingItems = @($mappingProperty.Value)
            if ($mappingItems.Count -ne 2) { throw "$slayerName must map both plugin and source directories." }
            if (-not ($mappingItems | Where-Object install_path -eq "addons/counterstrikesharp/source/$slayerName")) {
              throw "$slayerName source directory does not map to CounterStrikeSharp/source."
            }
            $expectedPluginPath = if ($slayerName -eq "SLAYER_AntiCamp") {
              "addons/counterstrikesharp/plugins/disabled/$slayerName"
            } else {
              "addons/counterstrikesharp/plugins/$slayerName"
            }
            if (-not ($mappingItems | Where-Object install_path -eq $expectedPluginPath)) {
              throw "$slayerName plugin directory does not map to expected path '$expectedPluginPath'."
            }
          }

          Write-Host "Validated versioned plugin + source mappings for both SLAYER addons."
          Write-Host "Validated $($manifest.addons.Count) manifest entries."
          Write-Host "Automated entries: $($automated.Count)"
          Write-Host "Manual entries: $($manual.Count)"

          $expectedPluginPolicies = @(
            @{ name = "CS2-Poor-MapPropAds"; type = "github_source_build"; install = "addons/counterstrikesharp/plugins/CS2-Poor-MapPropAds"; verify = "addons/counterstrikesharp/plugins/CS2-Poor-MapPropAds/CS2-Poor-MapPropAds.dll"; disabled = $false },
            @{ name = "CS2-Playervotes"; type = "github_source_build"; install = "addons/counterstrikesharp/plugins/Playervotes"; verify = "addons/counterstrikesharp/plugins/Playervotes/Playervotes.dll"; disabled = $false; framework = "net10.0" },
            @{ name = "CS2-StaffList"; type = "github_source_build"; install = "addons/counterstrikesharp/plugins/CS2Stafflist"; verify = "addons/counterstrikesharp/plugins/CS2Stafflist/CS2Stafflist.dll"; disabled = $false; framework = "net10.0" },
            @{ name = "SLAYER_Noscope"; type = "github_source_build"; install = "addons/counterstrikesharp/plugins/SLAYER_Noscope"; verify = "addons/counterstrikesharp/plugins/SLAYER_Noscope/SLAYER_Noscope.dll"; disabled = $false; framework = "net10.0" },
            @{ name = "ABS_MapCycle"; type = "github_source_build"; install = "addons/counterstrikesharp/plugins/disabled/ABS_MapCycle"; verify = "addons/counterstrikesharp/plugins/disabled/ABS_MapCycle/ABS_MapCycle.dll"; disabled = $true },
            @{ name = "CS2-Antibait"; type = "github_source_build"; install = "addons/counterstrikesharp/plugins/disabled/Antibait"; verify = "addons/counterstrikesharp/plugins/disabled/Antibait/Antibait.dll"; disabled = $true },
            @{ name = "CS2-KillFeedFilter"; type = "github_release"; install = "addons/counterstrikesharp/plugins/disabled/KillFeedFilter"; verify = "addons/counterstrikesharp/plugins/disabled/KillFeedFilter/KillFeedFilter.dll"; disabled = $true },
            @{ name = "AdvancedFriendlyFire"; type = "github_source_build"; install = "addons/counterstrikesharp/plugins/disabled/advanced_friendlyfire"; verify = "addons/counterstrikesharp/plugins/disabled/advanced_friendlyfire/advanced_friendlyfire.dll"; disabled = $true },
            @{ name = "CS2-Gunsmenu"; type = "github_source_build"; install = "addons/counterstrikesharp/plugins/disabled/GunsMenu"; verify = "addons/counterstrikesharp/plugins/disabled/GunsMenu/GunsMenu.dll"; disabled = $true; framework = "net10.0" }
          )
          foreach ($policy in $expectedPluginPolicies) {
            $addon = @($manifest.addons | Where-Object name -eq $policy.name) | Select-Object -First 1
            if (-not $addon) { throw "Missing manifest entry for $($policy.name)." }
            if ([string]$addon.type -ne $policy.type) { throw "$($policy.name) uses unexpected updater type '$($addon.type)'." }
            $configuredInstall = if ($policy.type -eq "github_source_build") {
              [string]$addon.install_directory
            } else {
              [string]$addon.install_path
            }
            if ($configuredInstall.TrimEnd("/") -ne $policy.install) {
              throw "$($policy.name) install target '$configuredInstall' does not match the expected target '$($policy.install)'."
            }
            if (@($addon.verify_paths | Where-Object { [string]$_ -eq $policy.verify }).Count -ne 1) {
              throw "$($policy.name) verification is missing '$($policy.verify)'."
            }
            $isDisabledPath = $configuredInstall -match '(?i)(^|/)plugins/disabled/'
            if ([bool]$policy.disabled -ne [bool]$isDisabledPath) {
              throw "$($policy.name) is not placed in the requested active/disabled plugin path."
            }
            if ($policy.name -eq "CS2-Gunsmenu" -and -not [bool]$addon.automation_supported) {
              throw "CS2-Gunsmenu is staged under plugins/disabled and must remain automation-enabled."
            }
            if ($policy.ContainsKey("framework") -and [string]$addon.target_framework -ne [string]$policy.framework) {
              throw "$($policy.name) must use target_framework '$($policy.framework)' for its source build."
            }
            if ($policy.type -eq "github_source_build") {
              if (-not [string]$addon.project -or -not [string]$addon.output_file) {
                throw "$($policy.name) source-build project/output_file metadata is missing."
              }
            }
          }

          $sourceBuilder = Get-Content -LiteralPath ".\scripts\Update-Addons.ps1" -Raw
          foreach ($requiredSourceFeature in @("source_mappings", "install_directory", "target_framework", "CopyLocalLockFileAssemblies", '-p:TargetFramework=$targetFramework')) {
            if ($sourceBuilder -notmatch [regex]::Escape($requiredSourceFeature)) {
              throw "Source-build updater feature check failed: $requiredSourceFeature"
            }
          }
          Write-Host "Validated new plugin updater types, destination policy, and required output paths."

      - name: Snapshot fixed configuration paths
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP "protected-configs.json"
          & pwsh -NoProfile -File ".\scripts\Test-AddonOverlay.ps1" -SnapshotConfigs -SnapshotPath $snapshot
          if ($LASTEXITCODE -ne 0) { throw "Could not snapshot the protected config paths." }

      - name: Configure Git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run addon updater
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ONLY: ${{ github.event.inputs.only }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          $arguments = @()
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_ONLY)) {
            $selected = @($env:INPUT_ONLY -split '[,;\s]+' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($selected.Count -gt 0) {
              $arguments += "-Only"
              $arguments += $selected
            }
          }

          if ($env:INPUT_FORCE -eq "true") {
            $arguments += "-Force"
          }

          & pwsh -NoProfile -File ".\scripts\Update-Addons.ps1" @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "The addon updater failed with exit code $LASTEXITCODE."
          }

      - name: Validate unified README catalog against manifest
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath ".\DEPENDENCIES.json" -Raw | ConvertFrom-Json
          $readme = Get-Content -LiteralPath ".\README.md" -Raw
          $header = "| Mod | Version / revision | Purpose | Payload placement / activation | Update automation |"
          $tableStart = $readme.IndexOf($header, [StringComparison]::Ordinal)
          if ($tableStart -lt 0) {
            throw "README is missing the unified plugin catalog table."
          }
          $tableLines = New-Object System.Collections.Generic.List[string]
          foreach ($line in ($readme.Substring($tableStart) -split '\r?\n')) {
            if ($line.StartsWith("|")) {
              $tableLines.Add($line)
            } elseif ($tableLines.Count -gt 0) {
              break
            }
          }
          $table = $tableLines -join [Environment]::NewLine
          $addons = @($manifest.addons)
          $linkedRows = [regex]::Matches($table, '(?m)^\|\s*\[[^\]]+\]\(https?://[^)]+\)\s*\|')
          if ($linkedRows.Count -ne 73) {
            throw "Unified README catalog should have 73 linked plugin rows; found $($linkedRows.Count)."
          }

          foreach ($addon in $addons) {
            $expectedVersion = [string]$addon.version
            if ($addon.PSObject.Properties.Name -contains "bundled_by") {
              $expectedVersion = "bundled"
            }
            elseif ([string]$addon.type -eq "github_source_build" -and
                -not [string]::IsNullOrWhiteSpace([string]$addon.branch)) {
              $shortCommit = $expectedVersion.Substring(0, [Math]::Min(12, $expectedVersion.Length))
              $expectedVersion = "$([string]$addon.branch)@$shortCommit"
            }
            $versionCell = [string][char]96 + $expectedVersion + [string][char]96
            $rowPattern = '^\|\s*\[' + [regex]::Escape([string]$addon.name) + '\]\(' +
              [regex]::Escape([string]$addon.repository) + '\)\s*\|\s*' +
              [regex]::Escape($versionCell) + '\s*\|'
            $matches = [regex]::Matches($table, $rowPattern, [System.Text.RegularExpressions.RegexOptions]::Multiline)
            if ($matches.Count -ne 1) {
              throw "README row must link $($addon.name) to its manifest repository and show version '$expectedVersion'."
            }
          }
          Write-Host "Validated $($addons.Count) Manifest rows inside the unified 73-row README plugin catalog."

      - name: Verify all installed addon files and protected configs
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP "protected-configs.json"
          & pwsh -NoProfile -File ".\scripts\Test-AddonOverlay.ps1" -VerifyAddons -CompareConfigSnapshot -SnapshotPath $snapshot
          if ($LASTEXITCODE -ne 0) {
            throw "Addon overlay validation failed."
          }

          $root = Join-Path $PWD "game\csgo"
          $allFiles = @(Get-ChildItem -LiteralPath $root -Recurse -File -Force)
          Write-Host "Tracked KUS payload contains $($allFiles.Count) files."
          Write-Host "Top-level addons:"
          Get-ChildItem -LiteralPath (Join-Path $root "addons") -Directory |
            Sort-Object Name |
            ForEach-Object { Write-Host (" - " + $_.Name) }

      - name: Push successful updater commits
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) {
            throw ("Unexpected uncommitted changes remain after updater:" + [Environment]::NewLine + $status)
          }

          $published = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Publishing updater commits, attempt $attempt/3..."
            git fetch origin integration/kus-monorepo
            if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch the latest integration branch before publishing updater commits."
            }

            $ahead = git rev-list --count origin/integration/kus-monorepo..HEAD
            if ($LASTEXITCODE -ne 0) {
              throw "Could not compare updater commits with the latest remote branch."
            }
            if ([int]$ahead -eq 0) {
              Write-Host "No updater commits need pushing; the remote already contains this checkout or has advanced."
              $published = $true
              break
            }

            git rebase origin/integration/kus-monorepo
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw "Updater commits conflict with newer repository changes. No force-push was attempted."
            }

            git push origin HEAD:integration/kus-monorepo
            if ($LASTEXITCODE -eq 0) {
              $published = $true
              break
            }
            Write-Warning "Remote advanced during push; retrying with a fresh fetch/rebase."
          }
          if (-not $published) {
            throw "Could not publish updater commits after three safe attempts."
          }
