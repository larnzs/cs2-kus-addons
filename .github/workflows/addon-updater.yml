name: Update CS2 Addons

on:
  push:
    branches:
      - integration/kus-monorepo
    paths:
      - "DEPENDENCIES.json"
      - "scripts/Update-Addons.ps1"
      - "scripts/Test-AddonOverlay.ps1"
      - "scripts/Inspect-Releases.ps1"
      - "scripts/Invoke-RuntimeAddonUpdate.ps1"
      - "scripts/check-updates.sh"
      - "scripts/update/**"
      - ".github/workflows/addon-updater.yml"
      - "win.bat"
      - "install.bat"
      - "update.bat"
      - "game-update.bat"
      - "game/csgo/**"
      - "README.md"
      - "examples/**"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Optional addon name, repository URL, slug, or comma-separated list. Empty means all automated addons."
        required: false
        default: ""
        type: string
      force:
        description: "Force reinstall selected release(s)."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: addon-updater
  cancel-in-progress: false

jobs:
  update-kus-addons:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'workflow_dispatch' || inputs.only == '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/kus-monorepo
          fetch-depth: 0
      - name: Set up .NET SDK for source-built add-ons
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install KUS updater tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip rsync
      - name: Validate syntax for every KUS and Larnz shell updater
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/check-updates.sh scripts/update/update.sh scripts/update/lib.sh scripts/update/manifest-addon.sh scripts/update/plugins/*.sh
          for special in scripts/update/plugins/metamod-source.sh scripts/update/plugins/counterstrikesharp.sh; do
            grep -q 'source scripts/update/manifest-addon.sh' "$special"
            grep -q 'manifest_update_version' "$special"
          done
          kus_script_count=0
          while IFS= read -r script; do
            [[ -n "$script" ]] || continue
            if [[ ! -f "scripts/update/plugins/$script" ]]; then
              echo "Missing KUS updater script documented in scripts/update/README.md: $script" >&2
              exit 1
            fi
            kus_script_count=$((kus_script_count + 1))
          done < <(sed -n '/^## Existing plugin scripts/,/^## Files/p' scripts/update/README.md | sed -nE 's/.*`plugins\/([^ `]+\.sh)`.*/\1/p')
          if [[ "$kus_script_count" -eq 0 ]]; then
            echo "No KUS per-plugin scripts were found in scripts/update/README.md." >&2
            exit 1
          fi

          manifest_script_count=0
          while IFS= read -r addon_name; do
            [[ -n "$addon_name" ]] || continue
            slug=$(printf '%s' "$addon_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
            if [[ ! -f "scripts/update/plugins/$slug.sh" ]]; then
              echo "Missing updater script for installed automated manifest add-on: $addon_name ($slug.sh)" >&2
              exit 1
            fi
            manifest_script_count=$((manifest_script_count + 1))
          done < <(jq -r '.addons[] | select(.installed == true) | select(.automation_supported != false) | .name' DEPENDENCIES.json)

          echo "Coverage passed: $kus_script_count KUS scripts documented; $manifest_script_count installed/automated manifest add-ons mapped to scripts."
          echo "All KUS and Larnz add-on shell scripts passed bash -n and special manifest-sync checks."
      - name: Run KUS and manifest-backed per-add-on scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/update/update.sh
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Updater left uncommitted changes:" >&2
            git status --short >&2
            exit 1
          fi
          git push origin HEAD:refs/heads/integration/kus-monorepo

  update:
    needs: update-kus-addons
    if: always() && github.actor != 'github-actions[bot]' && (needs.update-kus-addons.result == 'success' || needs.update-kus-addons.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout latest integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/kus-monorepo
          fetch-depth: 0

      - name: Validate PowerShell syntax, unified updater roles, and runtime policy
        shell: pwsh
        run: |
          $paths = @(
            ".\scripts\Update-Addons.ps1",
            ".\scripts\Test-AddonOverlay.ps1",
            ".\scripts\Inspect-Releases.ps1",
            ".\scripts\Deploy-Runtime.ps1",
            ".\scripts\Invoke-RuntimeAddonUpdate.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw ("PowerShell syntax errors in " + $path + ":" + [Environment]::NewLine + (($parseErrors | ForEach-Object Message) -join [Environment]::NewLine))
            }
          }

          $manifest = Get-Content -LiteralPath ".\DEPENDENCIES.json" -Raw | ConvertFrom-Json
          $metamod = @($manifest.addons | Where-Object name -eq "Metamod:Source") | Select-Object -First 1
          if (-not $metamod -or [string]$metamod.type -ne "github_release" -or
              [string]$metamod.version_format -ne "metamod" -or
              [string]$metamod.readme_url -ne "https://www.metamodsource.net/downloads.php?branch=dev") {
            throw "Metamod:Source must be managed from the KUS development download page."
          }
          $normalizedMetaTag = [regex]::Replace([string]$metamod.release_tag, '^([0-9]+\.[0-9]+\.[0-9]+)\.(\d+)$', '$1-$2')
          if ([string]$metamod.version -ne $normalizedMetaTag) {
            throw "Metamod:Source DEPENDENCIES.json version must match its normalized release_tag."
          }
          foreach ($assetPattern in @("mmsource-*-windows.zip", "mmsource-*-linux.tar.gz")) {
            if (@($metamod.assets | Where-Object { $_ -eq $assetPattern }).Count -ne 1) {
              throw "Metamod:Source must select both the latest Windows ZIP and Linux TAR.GZ release assets."
            }
          }
          foreach ($requiredPath in @(
            "addons/metamod/bin/win64/metamod.2.cs2.dll",
            "addons/metamod/bin/linuxsteamrt64/metamod.2.cs2.so"
          )) {
            if (@($metamod.verify_paths | Where-Object { $_ -eq $requiredPath }).Count -ne 1) {
              throw "Metamod:Source verification is missing $requiredPath."
            }
          }

          $css = @($manifest.addons | Where-Object name -eq "CounterStrikeSharp") | Select-Object -First 1
          if (-not $css) { throw "CounterStrikeSharp is missing from DEPENDENCIES.json." }
          if (-not [bool]$css.runtime_required) {
            throw "CounterStrikeSharp must have runtime_required=true."
          }
          foreach ($assetPattern in @(
            "counterstrikesharp-with-runtime-windows-{version}.zip",
            "counterstrikesharp-with-runtime-linux-{version}.zip"
          )) {
            if (@($css.assets | Where-Object { $_ -eq $assetPattern }).Count -ne 1) {
              throw "CounterStrikeSharp must select both platform with-runtime release assets."
            }
          }
          if ([string]$css.required_asset_name_contains -ne "with-runtime") {
            throw "CounterStrikeSharp runtime asset marker must cover both platform with-runtime packages."
          }
          $cssWindowsMapping = @($css.asset_mappings.PSObject.Properties | Where-Object Name -eq "counterstrikesharp-with-runtime-windows-{version}.zip") | Select-Object -First 1
          if (-not $cssWindowsMapping) { throw "CounterStrikeSharp Windows with-runtime mapping is missing." }
          $cssWindowsTargets = @($cssWindowsMapping.Value)
          if (-not ($cssWindowsTargets | Where-Object {
                [string]$_.merge -eq "release_plugin_directory" -and
                [string]$_.install_path -eq "addons/windows/addons/counterstrikesharp"
              })) {
            throw "CounterStrikeSharp Windows with-runtime files must populate the KUS Windows overlay."
          }
          if (-not ($cssWindowsTargets | Where-Object { [string]$_.merge -eq "release_csgo_root" })) {
            throw "CounterStrikeSharp Windows archive must also update the shared payload."
          }
          $cssLinuxMapping = @($css.asset_mappings.PSObject.Properties | Where-Object Name -eq "counterstrikesharp-with-runtime-linux-{version}.zip") | Select-Object -First 1
          if (-not $cssLinuxMapping -or
              -not (@($cssLinuxMapping.Value) | Where-Object { [string]$_.merge -eq "release_csgo_root" })) {
            throw "CounterStrikeSharp Linux with-runtime archive must update the shared payload."
          }
          if (-not (Test-Path -LiteralPath ".\game\csgo\addons\counterstrikesharp\bin\linuxsteamrt64\counterstrikesharp.so")) {
            throw "Shared Linux CounterStrikeSharp binary is missing from game/csgo."
          }
          foreach ($requiredGlob in @(
            "addons/windows/addons/counterstrikesharp/dotnet/shared/Microsoft.NETCore.App/*/System.Private.CoreLib.dll",
            "addons/windows/addons/counterstrikesharp/dotnet/host/fxr/*/hostfxr.dll"
          )) {
            if (@($css.verify_globs | Where-Object { $_ -eq $requiredGlob }).Count -ne 1) {
              throw "CounterStrikeSharp runtime verification glob is missing: $requiredGlob"
            }
          }

          $updater = Get-Content -LiteralPath ".\scripts\Update-Addons.ps1" -Raw
          if ($updater -notmatch 'Get-AddonMissingFiles' -or
              $updater -notmatch 'required_asset_name_contains' -or
              $updater -notmatch '\$needsRepair') {
            throw "The updater must enforce the runtime asset and repair missing files even when the version is unchanged."
          }

          $install = Get-Content -LiteralPath ".\install.bat" -Raw
          $win = Get-Content -LiteralPath ".\win.bat" -Raw
          $update = Get-Content -LiteralPath ".\update.bat" -Raw
          if ($win -match '(?i)steamcmd\.exe|\+app_update\s+730') {
            throw "win.bat must not perform SteamCMD game updates."
          }
          if ($win -match '(?im)^\s*start\s+.*cs2\.exe') {
            throw "win.bat must not launch cs2.exe."
          }
          if ($update -match '(?i)steamcmd\.exe|\+app_update\s+730') {
            throw "update.bat must not perform game updates."
          }
          if ($update -notmatch 'git pull --ff-only') {
            throw "update.bat must use a fast-forward-only Git pull."
          }
          if ($install -notmatch '(?i)\+app_update\s+730') {
            throw "install.bat must install CS2 during initial setup if it is missing."
          }
          $runtimeAddonUpdater = Get-Content -LiteralPath ".\scripts\Invoke-RuntimeAddonUpdate.ps1" -Raw
          if ($runtimeAddonUpdater -notmatch 'scripts\\Update-Addons\.ps1' -or
              $runtimeAddonUpdater -notmatch '"worktree", "add"' -or
              $runtimeAddonUpdater -notmatch 'Invoke-GitCapture' -or
              $runtimeAddonUpdater -notmatch '"push", "origin", "HEAD:refs/heads/\$Branch"' -or
              $runtimeAddonUpdater -notmatch 'worktree remove') {
            throw "Runtime addon updates must use an isolated worktree and publish successful commits to the private branch."
          }

          Write-Host "PowerShell syntax and unified updater role checks passed."
      - name: Validate example instance template
        shell: pwsh
        run: |
          $templateBat = (Get-Content -LiteralPath ".\examples\run-template\run.bat" -Raw) -replace [string][char]13, ""
          $templateUpdate = (Get-Content -LiteralPath ".\examples\run-template\update.bat" -Raw) -replace [string][char]13, ""
          $templateVbs = (Get-Content -LiteralPath ".\examples\run-template\run.vbs" -Raw) -replace [string][char]13, ""
          $templateGuardian = (Get-Content -LiteralPath ".\examples\run-template\watchdog.bat" -Raw) -replace [string][char]13, ""
          $templateIni = Get-Content -LiteralPath ".\examples\run-template\instance.example.ini" -Raw
          $templateIgnore = Get-Content -LiteralPath ".\examples\run-template\.gitignore" -Raw

          if ($templateBat -notmatch 'instance\.ini' -or $templateBat -notmatch 'WORKSHOP_ARGS' -or $templateBat -notmatch 'start "" /wait "%CS2_EXE%"') {
            throw "Example run.bat must read instance.ini, support optional Workshop collection, and launch one CS2 process."
          }
          foreach ($forbidden in @('git -C', 'app_update 730', 'UpdateUpstreamAddons', 'UpdateRepository', 'OverlayPayload', 'Invoke-RuntimeAddonUpdate', 'call "%~dp0update.bat"')) {
            if ($templateBat -match [regex]::Escape($forbidden)) {
              throw "Launch-only run.bat must not perform or invoke maintenance; found: $forbidden"
            }
          }
          foreach ($required in @('CS2-KUS-Maintenance.lock', ':WaitForMaintenance', 'Starting CS2 on port', 'set "RC=100"')) {
            if ($templateBat -notmatch [regex]::Escape($required)) {
              throw "Launch-only run.bat is missing expected behavior: $required"
            }
          }
          if ($templateBat -match '(?i)robocopy|xcopy|SyncCustomFiles|CustomSyncFailed') {
            throw "run.bat must not copy CUSTOM_FOLDER files into the shared runtime."
          }
          if ($templateBat -notmatch 'CUSTOM_FOLDER overrides are not mounted') {
            throw "run.bat must clearly report that custom-folder overrides are not currently mounted."
          }
          foreach ($required in @('git -C "%REPO_ROOT%" pull --ff-only origin integration/kus-monorepo', 'app_update 730', 'call :UpdateUpstreamAddons', ':OverlayPayload', ':AcquireLock', 'CS2-KUS-Maintenance-success.marker')) {
            if ($templateUpdate -notmatch [regex]::Escape($required)) {
              throw "Instance update.bat is missing maintenance behavior: $required"
            }
          }
          if ($templateUpdate -match '(?i)start "" /wait "%CS2_EXE%"| -dedicated |\+sv_maxplayers|\+exec %EXEC%|/MIR|/PURGE') {
            throw "Instance update.bat must not launch CS2 or use destructive mirroring/purge behavior."
          }
          if ($templateUpdate -match '(?i)CUSTOM_DIR|SyncOverrides|robocopy "%CUSTOM_FOLDER%|robocopy "%CUSTOM_DIR%') {
            throw "Instance update.bat must never merge CUSTOM_FOLDER files into shared runtime paths."
          }
          foreach ($required in @('ResolveRunnerBatch', 'CS2-KUS-Watchdog.log', 'shell.Run(commandLine, 0, True)', 'WScript.Sleep 100', 'On Error Resume Next', 'cmd.exe')) {
            if ($templateVbs -notmatch [regex]::Escape($required)) {
              throw "Hardened run.vbs is missing expected behavior: $required"
            }
          }
          if ($templateVbs -notmatch 'cmdExe = shell\.ExpandEnvironmentStrings\("%ComSpec%"\)' -or
              $templateVbs -notmatch 'runExitCode = shell\.Run\(commandLine, 0, True\)' -or
              $templateVbs -match '(?i)update\.bat|run_fast\.bat|supervisor\.ps1|Win32_Process|powershell|Maintenance-success\.marker') {
            throw "run.vbs must invoke only the launch runner, handle failures, and never run maintenance."
          }
          foreach ($required in @('cscript.exe', '%~dp0run.vbs', ':watch', 'goto :watch')) {
            if (-not $templateGuardian.Contains($required)) {
              throw "watchdog.bat is missing required guardian behavior: $required"
            }
          }
          if ($templateGuardian -match '(?i)update\.bat|app_update 730|Invoke-RuntimeAddonUpdate|robocopy') {
            throw "watchdog.bat must never perform maintenance."
          }
          if ($templateBat -match '(?i)/MIR|/PURGE') {
            throw "Custom-folder overrides must never use destructive mirror or purge options."
          }
          if ($templateBat -match '(?i)ForcePostExitMaintenance|WaitForAllCS2|RunMaintenance|UpdateGame') {
            throw "Launch-only run.bat must never enter maintenance or post-exit update loops."
          }
          if ($templateIni -match '(?im)^(API_KEY|STEAM_ACCOUNT)[ \t]*=[ \t]*\S') {
            throw "Example INI must not contain real API or game-server credentials."
          }
          if ($templateIni -notmatch '(?im)^RCON_PASSWORD=CHANGE_ME_TO_A_STRONG_PASSWORD[ \t\r]*$' -or
              $templateIgnore -notmatch '(?im)^instance\.ini[ \t\r]*$') {
            throw "Example INI must use a placeholder RCON password and ignore local instance.ini."
          }
          Write-Host "Validated no-write custom-folder policy, separate maintenance, hardened VBS loop, outer VBS guardian, and private INI policy."

      - name: Smoke-test explicit release archive mappings
        if: github.event_name != 'schedule'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $selected = @("SLAYER_AntiCamp", "SLAYER_HeadshotOnly", "VIPCore", "CS2-TeamLimiter", "cs2-showdamage")
          $ErrorActionPreference = "Stop"
          & ".\scripts\Inspect-Releases.ps1" -Only $selected
          if (-not $?) {
            throw "Explicit release archive mapping smoke test failed."
          }

      - name: Validate manifest and automation policy
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath ".\DEPENDENCIES.json" -Raw | ConvertFrom-Json
          if ([int]$manifest.schema_version -lt 2) {
            throw "Unsupported DEPENDENCIES.json schema version."
          }

          $css = @($manifest.addons | Where-Object name -eq "CounterStrikeSharp") | Select-Object -First 1
          if (-not $css -or -not [bool]$css.runtime_required) {
            throw "CounterStrikeSharp must be present and runtime_required=true."
          }
          if (@($css.assets | Where-Object { $_ -eq "counterstrikesharp-with-runtime-windows-{version}.zip" }).Count -ne 1) {
            throw "CounterStrikeSharp must use the Windows with-runtime package."
          }
          if (@($css.verify_globs).Count -lt 2) {
            throw "CounterStrikeSharp must verify versioned .NET runtime and hostfxr files."
          }

          $names = @($manifest.addons | ForEach-Object { [string]$_.name })
          $duplicates = @($names | Group-Object | Where-Object Count -gt 1)
          if ($duplicates.Count -gt 0) {
            throw ("Duplicate addon names: " + (($duplicates | ForEach-Object Name) -join ", "))
          }

          $weaponPaints = @($manifest.addons | Where-Object name -eq "WeaponPaints") | Select-Object -First 1
          if (-not $weaponPaints) {
            throw "WeaponPaints is missing from DEPENDENCIES.json."
          }
          if ($weaponPaints.PSObject.Properties.Name -contains "automation_supported" -and
              -not [bool]$weaponPaints.automation_supported) {
            throw "WeaponPaints must be managed by the stable-release updater."
          }

          $automated = @($manifest.addons | Where-Object {
            -not ($_.PSObject.Properties.Name -contains "automation_supported" -and -not [bool]$_.automation_supported)
          })
          $manual = @($manifest.addons | Where-Object {
            $_.PSObject.Properties.Name -contains "automation_supported" -and -not [bool]$_.automation_supported
          })
          foreach ($slayerName in @("SLAYER_AntiCamp", "SLAYER_HeadshotOnly")) {
            $slayer = @($manifest.addons | Where-Object name -eq $slayerName) | Select-Object -First 1
            if (-not $slayer) { throw "Missing manifest entry: $slayerName" }
            $assetPattern = "CS2.$slayerName.v{version}.zip"
            $mappingProperty = $slayer.asset_mappings.PSObject.Properties |
              Where-Object Name -eq $assetPattern |
              Select-Object -First 1
            if (-not $mappingProperty) { throw "Missing versioned asset mapping for $slayerName." }
            $mappingItems = @($mappingProperty.Value)
            if ($mappingItems.Count -ne 2) { throw "$slayerName must map both plugin and source directories." }
            if (-not ($mappingItems | Where-Object install_path -eq "addons/counterstrikesharp/source/$slayerName")) {
              throw "$slayerName source directory does not map to CounterStrikeSharp/source."
            }
            if (-not ($mappingItems | Where-Object install_path -eq "addons/counterstrikesharp/plugins/$slayerName")) {
              throw "$slayerName plugin directory does not map to plugins."
            }
          }

          Write-Host "Validated versioned plugin + source mappings for both SLAYER addons."
          Write-Host "Validated $($manifest.addons.Count) manifest entries."
          Write-Host "Automated entries: $($automated.Count)"
          Write-Host "Manual entries: $($manual.Count)"

      - name: Snapshot fixed configuration paths
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP "protected-configs.json"
          & pwsh -NoProfile -File ".\scripts\Test-AddonOverlay.ps1" -SnapshotConfigs -SnapshotPath $snapshot
          if ($LASTEXITCODE -ne 0) { throw "Could not snapshot the protected config paths." }

      - name: Configure Git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run addon updater
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ONLY: ${{ github.event.inputs.only }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          $arguments = @()
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_ONLY)) {
            $selected = @($env:INPUT_ONLY -split '[,;\s]+' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($selected.Count -gt 0) {
              $arguments += "-Only"
              $arguments += $selected
            }
          }

          if ($env:INPUT_FORCE -eq "true") {
            $arguments += "-Force"
          }

          & pwsh -NoProfile -File ".\scripts\Update-Addons.ps1" @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "The addon updater failed with exit code $LASTEXITCODE."
          }

      - name: Verify all installed addon files and protected configs
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP "protected-configs.json"
          & pwsh -NoProfile -File ".\scripts\Test-AddonOverlay.ps1" -VerifyAddons -CompareConfigSnapshot -SnapshotPath $snapshot
          if ($LASTEXITCODE -ne 0) {
            throw "Addon overlay validation failed."
          }

          $root = Join-Path $PWD "game\csgo"
          $allFiles = @(Get-ChildItem -LiteralPath $root -Recurse -File -Force)
          Write-Host "Tracked KUS payload contains $($allFiles.Count) files."
          Write-Host "Top-level addons:"
          Get-ChildItem -LiteralPath (Join-Path $root "addons") -Directory |
            Sort-Object Name |
            ForEach-Object { Write-Host (" - " + $_.Name) }

      - name: Push successful updater commits
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) {
            throw ("Unexpected uncommitted changes remain after updater:" + [Environment]::NewLine + $status)
          }

          git fetch origin integration/kus-monorepo
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch the latest integration branch before pushing updater commits."
          }

          $ahead = git rev-list --count origin/integration/kus-monorepo..HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Could not compare updater commits with the latest remote branch."
          }
          if ([int]$ahead -eq 0) {
            Write-Host "No updater commits need pushing; the remote already contains this checkout or has advanced."
            exit 0
          }

          git rebase origin/integration/kus-monorepo
          if ($LASTEXITCODE -ne 0) {
            throw "Could not rebase successful addon updates onto the latest integration branch. Resolve the conflict and retry."
          }

          git push origin HEAD:integration/kus-monorepo
          if ($LASTEXITCODE -ne 0) {
            throw "Push to integration/kus-monorepo failed after fetching and rebasing."
          }
