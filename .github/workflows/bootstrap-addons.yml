name: Bootstrap Remaining Addons
# Final full bootstrap of all automated addons.


on:
  push:
    paths:
      - ".github/workflows/bootstrap-addons.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-addons
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install remaining automated addons
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\Update-Addons.ps1"

      - name: Push results
        shell: pwsh
        run: |
          git push origin HEAD:main
