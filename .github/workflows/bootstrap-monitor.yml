name: Bootstrap CS2 Update Monitor

on:
  push:
    paths:
      - ".github/workflows/bootstrap-monitor.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install current monitor release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\Update-CS2UpdateMonitor.ps1" -Force

      - name: Push bootstrap result
        shell: pwsh
        run: |
          git push origin HEAD:main
