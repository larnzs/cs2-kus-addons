name: Inspect SLAYER Archives

on:
  push:
    paths:
      - ".github/workflows/inspect-slayer-archives.yml"

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Inspect archives
        shell: pwsh
        run: |
          $urls = @(
            'https://github.com/zakriamansoor47/SLAYER_AntiCamp/releases/download/v1.2.5/CS2.SLAYER_AntiCamp.v1.2.5.zip',
            'https://github.com/zakriamansoor47/SLAYER_HeadshotOnly/releases/download/v1.2.1/CS2.SLAYER_HeadshotOnly.v1.2.1.zip'
          )
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($url in $urls) {
            $zip = Join-Path $PWD ([IO.Path]::GetFileName($url))
            Invoke-WebRequest -Uri $url -OutFile $zip
            Write-Host "--- $zip ---" -ForegroundColor Cyan
            $archive = [IO.Compression.ZipFile]::OpenRead($zip)
            try { $archive.Entries | Sort-Object FullName | ForEach-Object { Write-Host $_.FullName } }
            finally { $archive.Dispose() }
          }
