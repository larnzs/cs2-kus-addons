name: KUS payload layout checks

on:
  push:
    branches:
      - integration/kus-monorepo
    paths:
      - "game/csgo/**"
      - "scripts/Deploy-Runtime.ps1"
      - "scripts/Patch-GameInfo.ps1"
      - "scripts/Test-AddonOverlay.ps1"
      - "scripts/Update-Addons.ps1"
      - "scripts/Inspect-Releases.ps1"
      - "scripts/Restructure-KUS-Payload.ps1"
      - "scripts/Integrate-KUS.ps1"
      - "windows/**"
      - "linux/**"
      - "docker/**"
      - ".dockerignore"
      - ".env.example"
      - ".gitignore"
      - "DEPENDENCIES.json"
      - "README.md"
      - "docs/Unified-README-HEADER.md"
      - ".github/workflows/payload-layout-check.yml"
      - ".github/workflows/addon-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-payload-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/kus-monorepo
          fetch-depth: 1

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n linux/install.sh linux/start.sh linux/run.sh linux/stop.sh docker/install_docker.sh linux/gcp.sh scripts/check-updates.sh scripts/update/update.sh scripts/update/lib.sh
          echo "Shell syntax passed."

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $paths = @(
            "scripts/Deploy-Runtime.ps1",
            "scripts/Patch-GameInfo.ps1",
            "scripts/Test-AddonOverlay.ps1",
            "scripts/Update-Addons.ps1",
            "scripts/Inspect-Releases.ps1",
            "scripts/Restructure-KUS-Payload.ps1",
            "scripts/Integrate-KUS.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw ("PowerShell syntax errors in " + $path + ":" + [Environment]::NewLine + (($errors | ForEach-Object Message) -join [Environment]::NewLine))
            }
          }
          Write-Host "PowerShell syntax passed."

      - name: Validate KUS payload roots, launch-time custom-folder copy, and Windows-safe tracked paths
        shell: bash
        run: |
          set -euo pipefail
          test -f game/csgo/addons/counterstrikesharp/bin/linuxsteamrt64/counterstrikesharp.so
          test -f game/csgo/addons/windows/addons/counterstrikesharp/bin/win64/counterstrikesharp.dll
          test -f game/csgo/addons/windows/addons/counterstrikesharp/dotnet/dotnet.exe
          test ! -e server/game/csgo
          python - <<'PY'
          import json
          import subprocess
          from collections import defaultdict
          from pathlib import Path

          with open("DEPENDENCIES.json", encoding="utf-8") as stream:
              manifest = json.load(stream)

          architecture = manifest["architecture"]
          assert architecture["target_root"] == "game/csgo", architecture
          assert architecture["platform_overlay_root"] == "game/csgo/addons/windows", architecture
          assert architecture["runtime_roots"]["windows"] == "server/game/csgo", architecture

          css = next(addon for addon in manifest["addons"] if addon["name"] == "CounterStrikeSharp")
          assert css["runtime_required"] is True
          assert css["install_path"] == "addons/windows/addons/counterstrikesharp"
          assert css["assets"] == [
              "counterstrikesharp-with-runtime-windows-{version}.zip",
              "counterstrikesharp-with-runtime-linux-{version}.zip",
          ]
          metamod = next(addon for addon in manifest["addons"] if addon["name"] == "Metamod:Source")
          assert metamod["version_format"] == "metamod"
          assert metamod["readme_url"] == "https://www.metamodsource.net/downloads.php?branch=dev"
          assert metamod["assets"] == ["mmsource-*-windows.zip", "mmsource-*-linux.tar.gz"]
          assert "addons/metamod/bin/win64/metamod.2.cs2.dll" in metamod["verify_paths"]
          assert "addons/metamod/bin/linuxsteamrt64/metamod.2.cs2.so" in metamod["verify_paths"]
          assert Path("game/csgo/addons/counterstrikesharp/bin/linuxsteamrt64/counterstrikesharp.so").is_file()
          assert Path("game/csgo/addons/windows/addons/counterstrikesharp/dotnet/dotnet.exe").is_file()
          for script in ("linux/install.sh", "linux/start.sh", "linux/run.sh", "docker/install_docker.sh"):
              text = Path(script).read_text(encoding="utf-8")
              assert 'rcon_lower="${RCON_PASSWORD,,}"' in text, f"{script} must reject weak or missing RCON passwords"
              assert '"changeme"' in text and '"change_me_to_a_strong_password"' in text, f"{script} must reject common RCON placeholders"
          for script in ("linux/install.sh", "linux/start.sh", "docker/install_docker.sh"):
              text = Path(script).read_text(encoding="utf-8")
              assert 'getent passwd "$user" >/dev/null 2>&1' in text, f"{script} must check existing users with valid shell redirection"
          gcp = Path("linux/gcp.sh").read_text(encoding="utf-8")
          assert "set -o pipefail" in gcp, "GCP bootstrap must propagate installer failure through tee"
          stop_script = Path("linux/stop.sh").read_text(encoding="utf-8")
          assert 'pgrep -u "$CS2_USER" -x cs2' in stop_script, "Linux stop must target CS2 processes only"
          assert "ps -ef | grep" not in stop_script and "xargs kill -9" not in stop_script, "Linux stop must not use the unsafe broad process-kill pipeline"
          for script in ("linux/install.sh", "docker/install_docker.sh"):
              text = Path(script).read_text(encoding="utf-8")
              assert 'tar -C "$PAYLOAD_ROOT"' in text, f"{script} must deploy the tracked payload with a non-destructive overlay"
              for protected in ("addons/counterstrikesharp/configs", "cfg/settings", "addons/windows"):
                  assert f"--exclude='./{protected}'" in text, f"{script} must exclude protected path {protected}"
              for destructive in ('rm -rf "$GAME_ROOT/addons"', 'rm -rf "$GAME_ROOT/cfg/settings"', 'rm -rf "$GAME_ROOT/addons/windows"'):
                  assert destructive not in text, f"{script} must not delete shared runtime paths: {destructive}"

          expected_entrypoints = (
              "windows/install.bat", "windows/win.bat", "windows/update.bat",
              "windows/game-update.bat", "windows/addons-update.bat",
              "windows/addons-inspect.bat", "windows/instance-template/run.bat",
              "linux/install.sh", "linux/gcp.sh", "docker/Dockerfile",
              "docker/docker-compose.yml", "docker/kubernetes/manifest.yaml", ".env.example",
          )
          for entrypoint in expected_entrypoints:
              assert Path(entrypoint).is_file(), f"Missing organized entrypoint: {entrypoint}"
          env_example = Path(".env.example").read_text(encoding="utf-8")
          compose = Path("docker/docker-compose.yml").read_text(encoding="utf-8")
          for key in ("STEAM_ACCOUNT", "RCON_PASSWORD", "API_KEY", "PORT", "TICKRATE", "MAXPLAYERS", "LAN", "EXEC", "MAP", "GAME_TYPE", "GAME_MODE", "MAP_GROUP"):
              assert any(line.startswith(f"{key}=") for line in env_example.splitlines()), f".env.example is missing {key}"
          assert "env_file:" in compose and "../.env" in compose, "Docker Compose must consume the root .env file"
          assert '"${PORT:-27015}:${PORT:-27015}/tcp"' in compose and '"${PORT:-27015}:${PORT:-27015}/udp"' in compose, "Docker Compose must publish the configured game port for both TCP and UDP"
          assert ".env" in Path(".gitignore").read_text(encoding="utf-8").splitlines(), "Real .env credentials must be ignored by Git"
          assert ".env.example" in Path(".dockerignore").read_text(encoding="utf-8").splitlines(), "The example env file does not need to be copied into the image"
          for old_root_entrypoint in ("install.bat", "win.bat", "update.bat", "game-update.bat", "install.sh", "run.sh", "start.sh", "stop.sh", "gcp.sh", "install_docker.sh", "Dockerfile", "docker-compose.yml", "manifest.yaml"):
              assert not Path(old_root_entrypoint).exists(), f"Root entrypoint was not moved: {old_root_entrypoint}"

          names = subprocess.run(
              ["git", "ls-tree", "-r", "--name-only", "HEAD"],
              check=True, capture_output=True, text=True
          ).stdout.splitlines()
          collisions = defaultdict(list)
          for name in names:
              collisions[name.casefold()].append(name)
          collisions = [paths for paths in collisions.values() if len(paths) > 1]
          assert not collisions, f"Windows case-insensitive path collisions remain: {collisions}"
          assert not any(name.startswith("server/game/csgo/") for name in names), "Downloaded runtime files must not be tracked under server/."

          install_bat = Path("windows/install.bat").read_text(encoding="utf-8")
          win_bat = Path("windows/win.bat").read_text(encoding="utf-8")
          update_bat = Path("windows/update.bat").read_text(encoding="utf-8")
          deploy = Path("scripts/Deploy-Runtime.ps1").read_text(encoding="utf-8")
          source_updater = Path("scripts/Update-Addons.ps1").read_text(encoding="utf-8")
          for script_name, script_text in (("install.bat", install_bat), ("update.bat", update_bat), ("win.bat", win_bat)):
              assert 'tasklist /FI "IMAGENAME eq cs2.exe"' in script_text, f"{script_name} must block destructive work while CS2 is active"
          assert 'Get-Process -Name "cs2"' in deploy, "Direct PowerShell deployment must refuse to replace active runtime add-ons"
          assert 'Get-Process -Name "cs2"' not in source_updater, "Source-only add-on updates must be allowed while CS2 is active"
          gcp = Path("linux/gcp.sh").read_text(encoding="utf-8")
          assert 'export API_KEY="${META_API_KEY:-}"' in gcp, "GCP must leave the optional API key empty when it is not configured"
          assert "+app_update 730 +quit" in install_bat
          assert "+app_update 730 validate" not in install_bat
          assert "Deploy-Runtime.ps1" in win_bat
          assert "set \"SEARCHSTRING=Game\tcsgo/addons/metamod\"" in win_bat
          assert "set \"INSERTAFTER=Game_LowViolence\tcsgo_lv\"" in win_bat
          assert 'findstr /n "^"' in win_bat
          assert "Patch-GameInfo.ps1" not in win_bat
          assert r'call "%ROOT_DIR%\windows\win.bat" --no-pause' in install_bat
          update_bat = Path("windows/update.bat").read_text(encoding="utf-8")
          game_update_bat = Path("windows/game-update.bat").read_text(encoding="utf-8")
          runner_bat = Path("windows/instance-template/run.bat").read_text(encoding="utf-8")
          assert r'call "%ROOT_DIR%\windows\win.bat" --no-pause' in update_bat
          assert r'call "%ROOT_DIR%\windows\win.bat" --no-pause' in game_update_bat
          assert 'set "GAME_DIR=%SERVER_DIR%\\game\\csgo"' in runner_bat
          assert "call :SyncCustomFiles" in runner_bat
          assert 'xcopy "%CUSTOM_DIR%\\cfg\\*"' in runner_bat
          assert 'xcopy "%CUSTOM_DIR%\\addons\\*"' in runner_bat
          assert "CUSTOM_FOLDER overrides are not mounted" not in runner_bat
          assert "/MIR" not in runner_bat.upper()
          assert "/PURGE" not in runner_bat.upper()
          for required in ('if not defined RCON_PASSWORD goto :MissingRconPassword', 'if /I "%RCON_PASSWORD%"=="CHANGE_ME_TO_A_STRONG_PASSWORD" goto :MissingRconPassword', ':MissingRconPassword'):
              assert required in runner_bat, f"Windows runner is missing the RCON safety guard: {required}"
          assert 'Copy-TreeContent -Source $WindowsOverlay -Destination $IncomingRoot' in deploy
          assert "Copy-UntrackedRuntimeFiles" in deploy
          assert "$SettingsTrackedRoots" in deploy
          assert "Copy-TreeContent -Source $ConfigDestination -Destination $BackupConfig" in deploy
          assert "Remove-Item -LiteralPath $ConfigDestination -Recurse -Force" in deploy
          assert "Existing CounterStrikeSharp configs preserved unchanged." in deploy
          assert "Copy-TreeContent -Source $BackupSettings -Destination $RuntimeSettings" not in deploy
          assert "Copy-TreeContent -Source $PreserveSettings -Destination $RuntimeSettings" in deploy
          assert "gameinfo.gi" in deploy
          integrate = Path("scripts/Integrate-KUS.ps1").read_text(encoding="utf-8")
          for protected in ("addons/counterstrikesharp/configs", "addons/windows/addons/counterstrikesharp/configs"):
              assert f'"{protected}"' in integrate, f"KUS import must explicitly preserve {protected}"
          assert "Copy-Tree -Source $KusRuntime -Destination $runtimeRoot -ExcludePaths $ProtectedConfigPaths" in integrate
          assert "foreach ($protectedRelative in $PreservedManualPaths)" in integrate
          addon_workflow = Path(".github/workflows/addon-updater.yml").read_text(encoding="utf-8")
          assert 'for attempt in 1 2 3; do' in addon_workflow and 'git rebase origin/integration/kus-monorepo' in addon_workflow, "Bash updater must safely retry remote push races"
          assert '$attempt -le 3' in addon_workflow and '$published = $false' in addon_workflow, "Windows updater must safely retry remote push races"
          for critical_step in (
              "Validate example instance template",
              "Smoke-test explicit release archive mappings",
              "Validate manifest and automation policy",
              "Snapshot fixed configuration paths",
              "Configure Git identity",
              "Run addon updater",
              "Verify all installed addon files and protected configs",
              "Push successful updater commits",
          ):
              assert addon_workflow.count(f"      - name: {critical_step}") == 1, f"Addon updater workflow has a duplicate or missing step: {critical_step}"
          print(f"Validated {len(names)} tracked paths and KUS staged layout.")
          PY
