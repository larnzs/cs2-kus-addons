name: Validate Pterodactyl payload sync and provisioning

on:
  push:
    branches:
      - integration/kus-monorepo
    paths:
      - "pterodactyl/**"
      - ".github/workflows/pterodactyl-sync-validation.yml"

permissions:
  contents: read

concurrency:
  group: pterodactyl-payload-sync-validation
  cancel-in-progress: false

jobs:
  validate-payload-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/kus-monorepo
          fetch-depth: 0

      - name: Install staging and PHP validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync php-cli

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            pterodactyl/sync-addon-payload-host.sh \
            pterodactyl/sync-addon-payload-container.sh \
            pterodactyl/test-sync-payload.sh \
            pterodactyl/install-host-services.sh

      - name: Validate PHP provisioner syntax and safe CLI argument handling
        shell: bash
        run: |
          set -euo pipefail
          php -l pterodactyl/provision-addon-servers.php

          # The post-start verification embeds a Bash preflight as a PHP nowdoc.
          # Extract and syntax-check that code too; PHP lint alone cannot parse it.
          python3 - <<'PY'
          from pathlib import Path
          import os

          source = Path("pterodactyl/provision-addon-servers.php").read_text()
          marker = "$preflight = <<<'BASH'\n"
          if source.count(marker) != 1:
              raise SystemExit("Expected exactly one embedded Bash preflight nowdoc.")
          start = source.index(marker) + len(marker)
          end = source.index("\nBASH;", start)
          target = Path(os.environ["RUNNER_TEMP"]) / "fragcity-provisioner-preflight.sh"
          target.write_text(source[start:end] + "\n")
          print(f"Extracted embedded preflight to {target}")
          PY
          bash -n "$RUNNER_TEMP/fragcity-provisioner-preflight.sh"

          php pterodactyl/provision-addon-servers.php --help > "$RUNNER_TEMP/fragcity-provisioner-help.txt"
          grep -Fq -- '--initialize-baseline' "$RUNNER_TEMP/fragcity-provisioner-help.txt"
          grep -Fq -- '--server <server-uuid>' "$RUNNER_TEMP/fragcity-provisioner-help.txt"
          grep -Fq -- '--verify-server <server-uuid>' "$RUNNER_TEMP/fragcity-provisioner-help.txt"

          set +e
          php pterodactyl/provision-addon-servers.php --server not-a-uuid > "$RUNNER_TEMP/fragcity-invalid-uuid.txt" 2>&1
          server_status=$?
          php pterodactyl/provision-addon-servers.php --verify-server not-a-uuid > "$RUNNER_TEMP/fragcity-invalid-verify-uuid.txt" 2>&1
          verify_status=$?
          set -e
          if [[ "$server_status" -ne 2 || "$verify_status" -ne 2 ]]; then
            cat "$RUNNER_TEMP/fragcity-invalid-uuid.txt" "$RUNNER_TEMP/fragcity-invalid-verify-uuid.txt"
            echo "Expected invalid UUID arguments for --server and --verify-server to be rejected with exit code 2."
            exit 1
          fi

      - name: Stage an immutable snapshot using the real host publisher
        shell: bash
        env:
          FRAGCITY_PAYLOAD_MOUNT: ${{ runner.temp }}/fragcity-addon-payload
          FRAGCITY_KEEP_REVISIONS: "3"
        run: |
          set -euo pipefail
          bash pterodactyl/sync-addon-payload-host.sh
          test -f "$FRAGCITY_PAYLOAD_MOUNT/CURRENT_COMMIT"
          test -f "$FRAGCITY_PAYLOAD_MOUNT/.sync.lock"
          test -f "$FRAGCITY_PAYLOAD_MOUNT/sync-addon-payload-container.sh"

      - name: Verify publisher repairs a revision missing disabled plugins
        shell: bash
        env:
          FRAGCITY_PAYLOAD_MOUNT: ${{ runner.temp }}/fragcity-addon-payload
        run: |
          set -euo pipefail
          commit="$(tr -d '\r\n' < "$FRAGCITY_PAYLOAD_MOUNT/CURRENT_COMMIT")"
          disabled_tree="$FRAGCITY_PAYLOAD_MOUNT/revisions/$commit/game/csgo/addons/counterstrikesharp/plugins/disabled"
          test -n "$(find "$disabled_tree" -type f -print -quit)"
          # Simulate a previously published but incomplete read-only revision in the temporary CI mount.
          # First make the disabled subtree and its parent writable so the fixture can remove it.
          chmod u+w -- "$(dirname -- "$disabled_tree")"
          chmod -R u+w -- "$disabled_tree"
          rm -rf -- "$disabled_tree"
          bash pterodactyl/sync-addon-payload-host.sh
          test -n "$(find "$disabled_tree" -type f -print -quit)"

          # Failure-path regression: make this revision incomplete again, then make a
          # required source directory unreadable so staging fails after it has begun.
          # The publisher must keep CURRENT_COMMIT and the existing revision directory.
          commit="$(tr -d '\r\n' < "$FRAGCITY_PAYLOAD_MOUNT/CURRENT_COMMIT")"
          disabled_tree="$FRAGCITY_PAYLOAD_MOUNT/revisions/$commit/game/csgo/addons/counterstrikesharp/plugins/disabled"
          chmod u+w -- "$(dirname -- "$disabled_tree")"
          chmod -R u+w -- "$disabled_tree"
          rm -rf -- "$disabled_tree"

          blocked_source="game/csgo/addons/multiaddonmanager"
          chmod 000 "$blocked_source"
          if bash pterodactyl/sync-addon-payload-host.sh; then
            chmod 755 "$blocked_source"
            echo "ERROR: publisher unexpectedly succeeded with an unreadable required source."
            exit 1
          else
            echo "Expected staging failure received; checking previous published revision was not removed."
          fi
          chmod 755 "$blocked_source"

          test "$(tr -d '\r\n' < "$FRAGCITY_PAYLOAD_MOUNT/CURRENT_COMMIT")" = "$commit"
          test -d "$FRAGCITY_PAYLOAD_MOUNT/revisions/$commit"
          test "$(tr -d '\r\n' < "$FRAGCITY_PAYLOAD_MOUNT/CURRENT_COMMIT")" = "$commit"
          test ! -e "$disabled_tree"

          # Restore the incomplete revision successfully; later tests run on a valid payload.
          bash pterodactyl/sync-addon-payload-host.sh
          test -n "$(find "$disabled_tree" -type f -print -quit)"

      - name: Test container sync, idempotency, stale-file cleanup, and exclusions
        shell: bash
        env:
          FRAGCITY_PAYLOAD_MOUNT: ${{ runner.temp }}/fragcity-addon-payload
        run: |
          set -euo pipefail
          bash pterodactyl/test-sync-payload.sh \
            "$FRAGCITY_PAYLOAD_MOUNT" \
            "$RUNNER_TEMP/fragcity-game"
