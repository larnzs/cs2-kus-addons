name: Validate Pterodactyl payload sync and provisioning

on:
  push:
    branches:
      - integration/kus-monorepo
    paths:
      - "pterodactyl/**"
      - ".github/workflows/pterodactyl-sync-validation.yml"

permissions:
  contents: read

concurrency:
  group: pterodactyl-payload-sync-validation
  cancel-in-progress: false

jobs:
  validate-payload-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/kus-monorepo
          fetch-depth: 0

      - name: Install staging and PHP validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync php-cli

      - name: Validate FragCity Egg startup hook
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("pterodactyl/egg-kitsune-lab-c-s2-go--k4ryuu-m-o-d-i-f-i-e-d.json")
          egg = json.loads(path.read_text())
          startup = egg.get("startup", "")
          prefix = "bash /home/container/egg/fragcity-payload/sync-addon-payload-container.sh && "
          if not startup.startswith(prefix):
              raise SystemExit("FragCity Egg startup must run the payload synchronizer before CS2.")
          if startup.count("sync-addon-payload-container.sh") != 1:
              raise SystemExit("FragCity Egg startup must contain exactly one sync hook.")
          if "&& ./game/cs2.sh {{CUSTOM_PARAMS}} -tickrate {{TICKRATE}}" not in startup:
              raise SystemExit("The original modified FragCity CS2 launch command was not preserved.")
          for required in ("{{AUTHKEY}}", "{{MAPGROUP}}", "{{WORKSHOP}}", "{{SERVER_PORT}}"):
              if required not in startup:
                  raise SystemExit(f"Original modified Egg startup variable missing: {required}")
          print("PASS: Egg startup runs one FragCity sync hook before the original CS2 command.")
          PY

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            pterodactyl/sync-addon-payload-host.sh \
            pterodactyl/sync-addon-payload-container.sh \
            pterodactyl/test-sync-payload.sh \
            pterodactyl/install-host-services.sh \
            pterodactyl/systemd/fragcity-status-dashboard.sh \
            pterodactyl/fragcity-manager.sh

          grep -Fq 'publish_status_dashboard' pterodactyl/sync-addon-payload-host.sh
          grep -Fq 'copy_tree "$REPO_GAME_ROOT" "$STAGING_GAME"' pterodactyl/sync-addon-payload-host.sh
          grep -Fq 'is_k4ryuu_runtime_path()' pterodactyl/sync-addon-payload-host.sh
          grep -Fq 'every other file, including plugins/disabled/' pterodactyl/sync-addon-payload-host.sh
          grep -Fq -- "--exclude='/csgo/addons/counterstrikesharp/api/***'" pterodactyl/sync-addon-payload-host.sh
          grep -Fq -- "--exclude='/csgo/addons/counterstrikesharp/bin/***'" pterodactyl/sync-addon-payload-host.sh
          grep -Fq -- "--exclude='/csgo/addons/counterstrikesharp/dotnet/***'" pterodactyl/sync-addon-payload-host.sh
          grep -Fq -- "--exclude='/csgo/addons/counterstrikesharp/lang/***'" pterodactyl/sync-addon-payload-host.sh
          grep -Fq -- "--exclude='/csgo/addons/metamod/bin/***'" pterodactyl/sync-addon-payload-host.sh
          grep -Fq -- "--exclude='/csgo/addons/metamod/counterstrikesharp.vdf'" pterodactyl/sync-addon-payload-host.sh
          grep -Fq -- "--exclude='/csgo/addons/metamod/metaplugins.ini'" pterodactyl/sync-addon-payload-host.sh
          grep -Fq 'Required first-install seed file is missing' pterodactyl/sync-addon-payload-host.sh
          grep -Fq '.fragcity-game-files-v1.list' pterodactyl/sync-addon-payload-host.sh
          grep -Fq 'Loaded the complete deployable game/ inventory:' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'is_customer_config_path()' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'is_runtime_excluded_path()' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'Leaving K4ryuu-managed runtime path untouched' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'Verified both subscribed_*_ids.txt seed files on the first install.' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'Seeding missing subscribed-ID file without overwriting existing customer data' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'Required subscribed-ID file is missing or unsafe after sync' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'Preserving stale customer config file after first install' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'First-install seed is pending' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'FRAGCITY_BASELINE_SHA256' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'waiting up to 90 seconds for the host provisioner' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'csgo/cfg/*|csgo/addons/counterstrikesharp/configs/*' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'GAME_SOURCE="$PAYLOAD_ROOT/game"' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'MANAGED_MANIFEST' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'Removing stale previously-managed payload file' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'No prior managed-payload manifest' pterodactyl/sync-addon-payload-container.sh
          grep -Fq 'new UUID did not wait for host Provisioner registration' pterodactyl/test-sync-payload.sh
          grep -Fq 'customer-customized-config' pterodactyl/test-sync-payload.sh
          grep -Fq 'stale_config_rel' pterodactyl/test-sync-payload.sh
          grep -Fq 'new UUID did not wait for host Provisioner registration' pterodactyl/test-sync-payload.sh
          grep -Fq 'expect_config_path no csgo/addons/otherplugin/extra.cfg' pterodactyl/test-sync-payload.sh
          grep -Fq 'customer-subscribed-file-ids' pterodactyl/test-sync-payload.sh
          grep -Fq 'customer-subscribed-collection-ids' pterodactyl/test-sync-payload.sh
          grep -Fq 'Repair only' pterodactyl/test-sync-payload.sh
          grep -Fq 'csgo/subscribed_file_ids.txt' pterodactyl/test-sync-payload.sh
          grep -Fq 'installed-by-k4ryuu' pterodactyl/test-sync-payload.sh
          grep -Fq 'FAIL: K4ryuu-managed runtime path was staged' pterodactyl/test-sync-payload.sh
          grep -Fq 'FRAGCITY_BASELINE_SHA256' pterodactyl/test-sync-payload.sh
          grep -Fq 'plugins/disabled' pterodactyl/test-sync-payload.sh
          grep -Fq 'CS2UpdateMonitor' pterodactyl/test-sync-payload.sh
          grep -Fq 'BotAI' pterodactyl/test-sync-payload.sh
          grep -Fq '.fragcity-game-files-v1.list' pterodactyl/provision-addon-servers.php
          grep -Fq 'verified %d update-managed non-config file(s)' pterodactyl/provision-addon-servers.php
          grep -Fq 'is_customer_config_path()' pterodactyl/provision-addon-servers.php
          grep -Fq 'prepareConfigSeedMarker' pterodactyl/provision-addon-servers.php
          grep -Fq 'assertRunningPayloadMount(' pterodactyl/provision-addon-servers.php
          grep -Fq 'Recovered first-start race' pterodactyl/provision-addon-servers.php
          grep -Fq 'Registration mismatch for ' pterodactyl/provision-addon-servers.php
          grep -Fq 'publishBaselineHashRegistry' pterodactyl/provision-addon-servers.php
          grep -Fq -- '--publish-baseline-registry' pterodactyl/provision-addon-servers.php
          grep -Fq 'baselineRegistryStatus(' pterodactyl/server-mount-status.php
          grep -Fq 'initialSeedState(' pterodactyl/server-mount-status.php
          grep -Fq 'MOUNT_SEED_PENDING' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'Baseline hash registry:' pterodactyl/fragcity-manager.sh
          grep -Fq 'FIRST SEED' pterodactyl/fragcity-manager.sh
          grep -Fq 'publish_baseline_hash_registry()' pterodactyl/sync-addon-payload-host.sh
          grep -Fq -- '--publish-baseline-registry' pterodactyl/install-host-services.sh
          grep -Fq 'LIVE UPDATE DETECTED' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'paint_switch' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'HOST HEALTH' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'SYSTEM POSTURE' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'MOUNTED BUT NOT RUNNING' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'MOUNT_ATTENTION_ROWS+=' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'NODE OPERATIONS CONSOLE' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'show_service_row' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'SERVICE HEALTH' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'ACTIVE MOUNTED SERVERS' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'server-mount-status.php' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'NETWORK SNAPSHOT' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'LATEST AUTOMATION EVENTS' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'MOUNT_REFRESH_SECONDS' pterodactyl/systemd/fragcity-status-dashboard.sh
          grep -Fq 'LIVE UPDATE DETECTED' pterodactyl/fragcity-manager.sh
          grep -Fq 'enable --now' pterodactyl/fragcity-manager.sh
          grep -Fq 'disable --now' pterodactyl/fragcity-manager.sh
          grep -Fq 'read -r -t 60' pterodactyl/fragcity-manager.sh
          grep -Fq 'R Refresh status now' pterodactyl/fragcity-manager.sh
          grep -Fq 'if [[ "$CURRENT_HOME" != "$HOME_RENDERED" ]]' pterodactyl/fragcity-manager.sh
          if grep -Fq 'read -r -t 2' pterodactyl/fragcity-manager.sh; then
            echo "Manager must not poll/repaint every two seconds."
            exit 1
          fi
          grep -Fq 'installation_wizard()' pterodactyl/fragcity-manager.sh
          grep -Fq 'I First install / reinstall' pterodactyl/fragcity-manager.sh
          grep -Fq "FRAGCITY_LAUNCH_DASHBOARD=0" pterodactyl/fragcity-manager.sh
          grep -Fq 'FRAGCITY_LAUNCH_DASHBOARD' pterodactyl/install-host-services.sh
          grep -Fq 'Exec=xfce4-terminal' pterodactyl/FragCity-Control-Center.desktop
          for screen in screen_docker screen_wings screen_cs2node screen_php screen_nginx screen_panel screen_mariadb screen_redis screen_all screen_host; do
            grep -Fq "$screen()" pterodactyl/fragcity-manager.sh
          done
          grep -Fq 'DOCKER ENGINE & CONTAINERS' pterodactyl/fragcity-manager.sh
          grep -Fq 'PTERODACTYL WINGS' pterodactyl/fragcity-manager.sh
          grep -Fq 'PHP CLI / PHP-FPM' pterodactyl/fragcity-manager.sh
          grep -Fq 'server-mount-status.php' pterodactyl/fragcity-manager.sh
          grep -Fq 'render_main_status' pterodactyl/fragcity-manager.sh
          grep -Fq 'ELIGIBLE SERVER UUIDs / FRAGCITY MOUNT STATUS' pterodactyl/fragcity-manager.sh
          grep -Fq 'HOST SERVICES — ACTIVE / ENABLED AT BOOT' pterodactyl/fragcity-manager.sh

      - name: Validate PHP provisioner syntax and safe CLI argument handling
        shell: bash
        run: |
          set -euo pipefail
          php -l pterodactyl/provision-addon-servers.php
          php -l pterodactyl/server-mount-status.php

          # The post-start verification embeds a Bash preflight as a PHP nowdoc.
          # Extract and syntax-check that code too; PHP lint alone cannot parse it.
          python3 - <<'PY'
          from pathlib import Path
          import os

          source = Path("pterodactyl/provision-addon-servers.php").read_text()
          marker = "$preflight = <<<'BASH'\n"
          if source.count(marker) != 1:
              raise SystemExit("Expected exactly one embedded Bash preflight nowdoc.")
          start = source.index(marker) + len(marker)
          end = source.index("\nBASH;", start)
          target = Path(os.environ["RUNNER_TEMP"]) / "fragcity-provisioner-preflight.sh"
          target.write_text(source[start:end] + "\n")
          print(f"Extracted embedded preflight to {target}")
          PY
          bash -n "$RUNNER_TEMP/fragcity-provisioner-preflight.sh"

          php pterodactyl/provision-addon-servers.php --help > "$RUNNER_TEMP/fragcity-provisioner-help.txt"
          grep -Fq -- '--initialize-baseline' "$RUNNER_TEMP/fragcity-provisioner-help.txt"
          grep -Fq -- '--publish-baseline-registry' "$RUNNER_TEMP/fragcity-provisioner-help.txt"
          grep -Fq -- '--exclude <server-uuid>' "$RUNNER_TEMP/fragcity-provisioner-help.txt"
          grep -Fq -- '--server <server-uuid>' "$RUNNER_TEMP/fragcity-provisioner-help.txt"
          grep -Fq -- '--verify-server <server-uuid>' "$RUNNER_TEMP/fragcity-provisioner-help.txt"

          set +e
          php pterodactyl/provision-addon-servers.php --server not-a-uuid > "$RUNNER_TEMP/fragcity-invalid-uuid.txt" 2>&1
          server_status=$?
          php pterodactyl/provision-addon-servers.php --verify-server not-a-uuid > "$RUNNER_TEMP/fragcity-invalid-verify-uuid.txt" 2>&1
          verify_status=$?
          php pterodactyl/provision-addon-servers.php --initialize-baseline --exclude not-a-uuid > "$RUNNER_TEMP/fragcity-invalid-baseline-exclude.txt" 2>&1
          baseline_exclude_status=$?
          set -e
          if [[ "$server_status" -ne 2 || "$verify_status" -ne 2 || "$baseline_exclude_status" -ne 2 ]]; then
            cat "$RUNNER_TEMP/fragcity-invalid-uuid.txt" "$RUNNER_TEMP/fragcity-invalid-verify-uuid.txt" "$RUNNER_TEMP/fragcity-invalid-baseline-exclude.txt"
            echo "Expected invalid UUID arguments for server, verify-server and baseline exclusion to be rejected with exit code 2."
            exit 1
          fi

      - name: Stage an immutable snapshot using the real host publisher
        shell: bash
        env:
          FRAGCITY_PAYLOAD_MOUNT: ${{ runner.temp }}/fragcity-addon-payload
          FRAGCITY_KEEP_REVISIONS: "3"
        run: |
          set -euo pipefail
          bash pterodactyl/sync-addon-payload-host.sh
          test -f "$FRAGCITY_PAYLOAD_MOUNT/CURRENT_COMMIT"
          test -f "$FRAGCITY_PAYLOAD_MOUNT/.sync.lock"
          test -f "$FRAGCITY_PAYLOAD_MOUNT/sync-addon-payload-container.sh"

      - name: Verify publisher repairs a revision missing disabled plugins
        shell: bash
        env:
          FRAGCITY_PAYLOAD_MOUNT: ${{ runner.temp }}/fragcity-addon-payload
        run: |
          set -euo pipefail
          commit="$(tr -d '\r\n' < "$FRAGCITY_PAYLOAD_MOUNT/CURRENT_COMMIT")"
          disabled_tree="$FRAGCITY_PAYLOAD_MOUNT/revisions/$commit/game/csgo/addons/counterstrikesharp/plugins/disabled"
          test -n "$(find "$disabled_tree" -type f -print -quit)"
          # Simulate a previously published but incomplete read-only revision in the temporary CI mount.
          # First make the disabled subtree and its parent writable so the fixture can remove it.
          chmod u+w -- "$(dirname -- "$disabled_tree")"
          chmod -R u+w -- "$disabled_tree"
          rm -rf -- "$disabled_tree"
          # Rebuild the incomplete revision before asserting that recovery works.
          bash pterodactyl/sync-addon-payload-host.sh
          # The host publisher may fast-forward while running, so always resolve
          # the current published commit after each call before addressing its revision.
          commit="$(tr -d '\r\n' < "$FRAGCITY_PAYLOAD_MOUNT/CURRENT_COMMIT")"
          disabled_tree="$FRAGCITY_PAYLOAD_MOUNT/revisions/$commit/game/csgo/addons/counterstrikesharp/plugins/disabled"
          test -n "$(find "$disabled_tree" -type f -print -quit)"

          # Failure-path regression: remove disabled/ from the current immutable revision,
          # then inject an rsync failure during rebuild. The source checkout stays clean,
          # the staging directory gets created, and the incomplete published revision must
          # remain present until a later successful publisher invocation repairs it.
          chmod u+w -- "$(dirname -- "$disabled_tree")"
          chmod -R u+w -- "$disabled_tree"
          rm -rf -- "$disabled_tree"

          fail_bin="$(mktemp -d "$RUNNER_TEMP/fragcity-fail-bin.XXXXXX")"
          cat > "$fail_bin/rsync" <<'RSYNC'
          #!/usr/bin/env bash
          echo "Injected rsync failure for rollback safety test." >&2
          exit 97
          RSYNC
          chmod 0755 "$fail_bin/rsync"
          if PATH="$fail_bin:$PATH" bash pterodactyl/sync-addon-payload-host.sh; then
            rm -rf -- "$fail_bin"
            echo "ERROR: publisher unexpectedly succeeded despite injected staging failure."
            exit 1
          else
            echo "Expected staging failure received; checking the previous revision was not removed."
          fi
          rm -rf -- "$fail_bin"

          test "$(tr -d '\r\n' < "$FRAGCITY_PAYLOAD_MOUNT/CURRENT_COMMIT")" = "$commit"
          test -d "$FRAGCITY_PAYLOAD_MOUNT/revisions/$commit"
          test "$(tr -d '\r\n' < "$FRAGCITY_PAYLOAD_MOUNT/revisions/$commit/.source-commit")" = "$commit"
          test ! -e "$disabled_tree"

          # Restore the incomplete revision successfully, then refresh all pointers.
          bash pterodactyl/sync-addon-payload-host.sh
          commit="$(tr -d '\r\n' < "$FRAGCITY_PAYLOAD_MOUNT/CURRENT_COMMIT")"
          disabled_tree="$FRAGCITY_PAYLOAD_MOUNT/revisions/$commit/game/csgo/addons/counterstrikesharp/plugins/disabled"
          test -n "$(find "$disabled_tree" -type f -print -quit)"

      - name: Test complete game-tree sync, idempotency and stale-file cleanup
        shell: bash
        env:
          FRAGCITY_PAYLOAD_MOUNT: ${{ runner.temp }}/fragcity-addon-payload
        run: |
          set -euo pipefail
          bash pterodactyl/test-sync-payload.sh \
            "$FRAGCITY_PAYLOAD_MOUNT" \
            "$RUNNER_TEMP/fragcity-game"
