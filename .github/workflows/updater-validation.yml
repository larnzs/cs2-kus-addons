name: Updater Script Validation

on:
  push:
    branches:
      - integration/kus-monorepo
    paths:
      - 'scripts/**'
      - 'windows/**'
      - 'DEPENDENCIES.json'
      - '.github/workflows/updater-validation.yml'
  pull_request:
    branches:
      - integration/kus-monorepo
    paths:
      - 'scripts/**'
      - 'windows/**'
      - 'DEPENDENCIES.json'
      - '.github/workflows/updater-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate updater scripts and manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/update/manifest-addon.sh
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find scripts/update/plugins -type f -name '*.sh' -print0)

      - name: Test manifest updater helper behavior
        shell: bash
        run: |
          set -euo pipefail
          bash -euo pipefail <<'MANIFEST_HELPER_TEST'
          exec 3>&1
          source scripts/update/lib.sh
          source scripts/update/manifest-addon.sh

          # The generic helper must allow automated plugins but refuse manual-only ones.
          manifest_assert_automation_supported "CS2-Playervotes"
          if (manifest_assert_automation_supported "SLAYER_Noscope" >/dev/null 2>&1); then
            echo "ERROR: manual-only SLAYER_Noscope was allowed through the updater guard." >&2
            exit 1
          fi
          if (manifest_assert_automation_supported "CS2-Gunsmenu" >/dev/null 2>&1); then
            echo "ERROR: manual-only CS2-Gunsmenu was allowed through the updater guard." >&2
            exit 1
          fi

          # Exercise the real manifest source-patch loop without touching the payload.
          patch_root="$(mktemp -d)"
          trap 'rm -rf "$patch_root"' EXIT
          mkdir -p "$patch_root/src"
          find_text="$(jq -er '.addons[] | select(.name == "CS2-Playervotes") | .source_patches[0].find' DEPENDENCIES.json)"
          replace_text="$(jq -er '.addons[] | select(.name == "CS2-Playervotes") | .source_patches[0].replace' DEPENDENCIES.json)"
          printf '%s' "$find_text" > "$patch_root/src/Main.cs"
          manifest_apply_source_patches "CS2-Playervotes" "$patch_root"
          grep -Fq "$replace_text" "$patch_root/src/Main.cs"
          if grep -Fq "$find_text" "$patch_root/src/Main.cs"; then
            echo "ERROR: source compatibility text remained after patching." >&2
            exit 1
          fi
          before="$(cat "$patch_root/src/Main.cs")"
          manifest_apply_source_patches "CS2-Playervotes" "$patch_root"
          after="$(cat "$patch_root/src/Main.cs")"
          [[ "$before" == "$after" ]] || { echo "ERROR: repeated source patch changed an already-patched file." >&2; exit 1; }

          # VIPCore uses non-latest module-only releases as well as full releases.
          releases_fixture='[
            {"tag_name":"v2.0.3-modules-1","draft":false,"assets":[{"name":"VIP_Modules.zip"}]},
            {"tag_name":"v2.0.3","draft":false,"assets":[{"name":"VIPCore.zip"},{"name":"VIP_Modules.zip"}]},
            {"tag_name":"v2.0.4-modules-2","draft":true,"assets":[{"name":"VIP_Modules.zip"}]},
            {"tag_name":"v2.0.4","draft":false,"assets":[{"name":"VIPCore.zip"}]}
          ]'
          matched="$(github_latest_matching_release_tag "$releases_fixture" "VIP_Modules.zip" '^v[0-9]+\.[0-9]+\.[0-9]+(-modules-[0-9]+)?          MANIFEST_HELPER_TEST

      - name: Test gameinfo patch and manifest integrity
        shell: pwsh
        run: ./scripts/Test-UpdaterIntegrity.ps1

  validate-gameinfo-windows:
    name: Verify gameinfo patch on native Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run manifest and gameinfo regression tests in Windows PowerShell
        shell: pwsh
        run: ./scripts/Test-UpdaterIntegrity.ps1
)"
          [[ "$matched" == "v2.0.3-modules-1" ]] || { echo "ERROR: expected module-only release, got '$matched'." >&2; exit 1; }
          later_full_fixture='[
            {"tag_name":"v2.0.4","draft":false,"assets":[{"name":"VIPCore.zip"},{"name":"VIP_Modules.zip"}]},
            {"tag_name":"v2.0.3-modules-1","draft":false,"assets":[{"name":"VIP_Modules.zip"}]}
          ]'
          matched="$(github_latest_matching_release_tag "$later_full_fixture" "VIP_Modules.zip" '^v[0-9]+\.[0-9]+\.[0-9]+(-modules-[0-9]+)?          MANIFEST_HELPER_TEST

      - name: Test gameinfo patch and manifest integrity
        shell: pwsh
        run: ./scripts/Test-UpdaterIntegrity.ps1

  validate-gameinfo-windows:
    name: Verify gameinfo patch on native Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run manifest and gameinfo regression tests in Windows PowerShell
        shell: pwsh
        run: ./scripts/Test-UpdaterIntegrity.ps1
)"
          [[ "$matched" == "v2.0.4" ]] || { echo "ERROR: expected later full release, got '$matched'." >&2; exit 1; }

          full_repair_pattern="$(jq -r '.addons[] | select(.name == "VIPCore Modules") | .repair_track_tag_regex' DEPENDENCIES.json)"
          full_repair_tag="$(github_latest_matching_release_tag "$releases_fixture" "VIP_Modules.zip" "$full_repair_pattern")"
          [[ "$full_repair_tag" == "v2.0.3" ]] || { echo "ERROR: full repair selector should choose v2.0.3, got '$full_repair_tag'." >&2; exit 1; }

          jq -e '.addons[] | select(.name == "VIPCore") | .installed == true and (.depends_on | index("Metamod:Source") != null) and (.verify_paths | index("addons/counterstrikesharp/shared/VipCoreApi/VipCoreApi.dll") != null)' DEPENDENCIES.json >/dev/null
          jq -e '.addons[] | select(.name == "VIPCore") | (.asset_mappings["VIPCore.zip"] | length == 2 and any(.[]; .source_path_mode == "csgo_root" and .source_path == "addons/counterstrikesharp/plugins/VIPCore" and .install_path == "addons/counterstrikesharp/plugins/VIPCore") and any(.[]; .source_path_mode == "csgo_root" and .source_path == "addons/counterstrikesharp/shared/VipCoreApi" and .install_path == "addons/counterstrikesharp/shared/VipCoreApi"))' DEPENDENCIES.json >/dev/null
          [[ "$(jq -r '.addons[] | select(.name == "VIPCore Modules") | .asset_mappings["VIP_Modules.zip"].source_path_mode' DEPENDENCIES.json)" == "archive_root" ]] || {
            echo "ERROR: VIP_Modules.zip must be mapped from archive_root." >&2
            exit 1
          }

          echo "PASS: Bash manifest guard, release-track resolver and source-patch helper behavior."
          MANIFEST_HELPER_TEST

      - name: Test gameinfo patch and manifest integrity
        shell: pwsh
        run: ./scripts/Test-UpdaterIntegrity.ps1

  validate-gameinfo-windows:
    name: Verify gameinfo patch on native Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run manifest and gameinfo regression tests in Windows PowerShell
        shell: pwsh
        run: ./scripts/Test-UpdaterIntegrity.ps1
