services:
  cs2_modded_server:
    image: cs2-modded-server:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cs2-modded-server
    env_file:
      - ../.env
    volumes:
      - cs2-volume:/home/steam/
    ports:
      - "${PORT:-27015}:${PORT:-27015}/tcp"
      - "${PORT:-27015}:${PORT:-27015}/udp"
      - "27020:27020/tcp"
      - "27020:27020/udp"
    cpu_count: 2
    mem_limit: 3500m
    # command: tail -F anything

volumes:
  cs2-volume: