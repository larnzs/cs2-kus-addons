SERVER_DIR=..\..\server

; Public address advertised to clients (use your reachable public IP)
IP=85.185.40.85

; Optional local bind address. 0.0.0.0 listens on all interfaces.
BIND_IP=0.0.0.0

; Custom files folder, relative to this template folder unless absolute
CUSTOM_FOLDER=aim

; Max players
MAXPLAYERS=64

; Server port for players to connect
PORT=27085

; Tickrate (64 is MM, 128 is ESEA/Faceit)
TICKRATE=128

; Steam Web API key (optional; leave blank if not needed)
API_KEY=

; Game server login token (required for public online server)
; Keep your real token only in instance.ini, never commit it.
STEAM_ACCOUNT=

; LAN server: 0 = public, 1 = private
LAN=0

; Password to join the server (empty means no password)
SERVER_PASSWORD=

; RCON password: replace this placeholder before running
RCON_PASSWORD=CHANGE_ME_TO_A_STRONG_PASSWORD

; Execute config on boot
EXEC=aim.cfg

; Map and map group
MAPGROUP=mg_aim
MAP=de_mirage

; Optional workshop collection ID; leave blank to disable
WORKSHOP_COLLECTION=
