// Mode-switch cleanup for every manually loadable CounterStrikeSharp plugin in plugins/disabled.
// Use the exact DLL path so unload does not depend on the plugin's display/ModuleName.
// All disabled-folder plugins are reset on each mode switch, including optional Settings plugins.
// Dependencies (for example Newtonsoft.Json.dll, MySqlConnector.dll, CounterStrikeSharp.API.dll) are not plugin entry points and are intentionally excluded.

