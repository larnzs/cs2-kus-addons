exec gamemode_rush.cfg

sv_cheats 1

exec settings/no_warmup.cfg
exec settings/alltalk_on.cfg
exec settings/map_voting.cfg

// Bots
// `settings/bots_buy.cfg` is deliberately NOT executed here. Rush ships its own bot
// behaviour tree (`mp_bot_ai_bt` in `gamemode_rush.cfg`) that knows the mode, and
// bots_buy.cfg would replace it. The cache is cleared in case another mode set its own.
mp_bot_ai_bt_clear_cache
exec bots.cfg
// bot_quota intentionally remains 0 under the permanent FragCity no-bot policy.

exec custom_valve-rush.cfg

// Final mode guard: Rush must never spawn bots.
exec settings/disable_bots.cfg

sv_cheats 0

echo "valve-rush_settings.cfg executed"
